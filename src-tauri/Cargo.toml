[package]
name = "sumzle-tauri"
version = "0.1.0"
description = "Sumzle HPC Solver - mobile edition powered by Tauri"
authors = ["SUSTechHSAS"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "sumzle_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 (mobile support built in)
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Serialize command args / responses
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The actual solver library (path = ../)
sumzle-solver = { path = ".." }
# Async solve (run blocking solver on a thread pool)
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
num_cpus = "1"
anyhow = "1"

[profile.dev]
# Slightly optimized dev build so the solver is usable in debug
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
