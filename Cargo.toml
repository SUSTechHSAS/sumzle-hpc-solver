[package]
name = "sumzle-solver"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "High-performance Sumzle puzzle solver with multi-core and distributed computing support"
license = "MIT"
repository = "https://github.com/sumzle-solver/sumzle-solver"

[[bin]]
name = "sumzle-solver"
path = "src/main.rs"

[[bench]]
name = "benchmark"
harness = false
path = "benches/benchmark.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
num_cpus = "1.16"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
# Bridges a tokio mpsc channel into a `Stream` for the SSE progress endpoint
# and the chunked NDJSON solution-stream endpoint.
tokio-stream = "0.1"
# Returning-friendly global allocator. The long-running `serve` process builds
# and frees large solution sets each request; glibc's default malloc retains
# those freed pages in per-thread arenas, so RSS grows and never comes back
# down across solves (issue #20). mimalloc decommits freed memory back to the
# OS, keeping server memory steady. Cross-platform (Linux/macOS/Windows).
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
tower = "0.5"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
