name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast gate: format + clippy + cargo check
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo check

  test:
    name: Test on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macOS-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose 2>&1 | tee test-output.txt
        shell: bash

      - name: Create test summary
        if: always()
        shell: bash
        run: |
          echo "## 🧪 Test Results — \`${{ matrix.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`${{ matrix.os }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`${{ matrix.target }}\` |" >> $GITHUB_STEP_SUMMARY

          sed 's/\r$//' test-output.txt | awk '
            BEGIN { suite_count=0; result_count=0; sumzle_count=0 }

            /^[[:space:]]*Doc-tests[[:space:]]/ {
              suite_name[suite_count++] = "Doc-tests"
            }

            /Running/ && /target[\/\\]debug[\/\\]deps[\/\\]/ && !/--crate-name/ {
              path = $0
              sub(/.*target[\/\\]debug[\/\\]deps[\/\\]/, "", path)
              sub(/[\x27`"].*$/, "", path)
              sub(/-[^-]+$/, "", path)
              sub(/\.exe$/, "", path)

              sumzle_count++
              if (path == "sumzle_solver") {
                if (sumzle_count == 1) suite_name[suite_count++] = "unittests (lib)"
                else                   suite_name[suite_count++] = "unittests (bin)"
              } else if (path == "consistency") {
                suite_name[suite_count++] = "integration tests"
              } else {
                suite_name[suite_count++] = path
              }
            }

            /^test result:/ {
              idx = result_count
              for (i=1; i<=NF; i++) {
                if ($i ~ /^[0-9]+$/ && $(i+1) ~ /^passed/)  passed[idx]  = $i+0
                if ($i ~ /^[0-9]+$/ && $(i+1) ~ /^failed/)  failed[idx]  = $i+0
                if ($i ~ /^[0-9]+$/ && $(i+1) ~ /^ignored/) ignored[idx] = $i+0
                if ($i ~ /^[0-9]+$/ && $(i+1) ~ /^measured/) measured[idx] = $i+0
                if ($i ~ /^[0-9.]+s$/) duration[idx] = $i
              }
              result_count++
            }

            END {
              tp=0; tf=0; ti=0; tm=0
              for (i=0; i<result_count; i++) {
                p  = passed[i]+0;  f = failed[i]+0
                ig = ignored[i]+0; d = duration[i]
                if (d == "") d = "N/A"
                tp += p; tf += f; ti += ig; tm += measured[i]+0
                icon = (f > 0) ? "❌" : "✅"
                name = (i < suite_count) ? suite_name[i] : "Suite #" (i+1)
                printf "| → %s | %s %d passed, %d failed, %d ignored (%s) |\n", \
                       name, icon, p, f, ig, d
              }
              total = tp + tf + ti + tm
              printf "| **Total tests** | **%d** |\n", total
              printf "| **Passed** | **%d** |\n", tp
              printf "| **Failed** | **%d** |\n", tf
              printf "| **Ignored** | **%d** |\n", ti
              printf "| **Measured** | **%d** |\n", tm

              if (tf > 0) printf "\n> ⚠️ **%d test(s) failed!**\n", tf
              else        printf "\n> ✅ All tests passed!\n"
            }
          ' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Test Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      # ---------------------------------------------------------------
      #  Current branch (PR head or push branch) benchmarks
      # ---------------------------------------------------------------

      - name: Build release binary
        run: cargo build --release

      - name: Run CLI benchmarks
        run: |
          echo "## 📊 CLI Solver Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run CLI benchmarks for all supported lengths and save results
          # in a machine-parseable format: length:solutions:searched:time_raw
          > current-bench-results.txt
          for len in 3 4 5 6 7 8; do
            echo "Running CLI benchmark for length $len..."
            OUTPUT=$(./target/release/sumzle-solver bench -l $len 2>&1 || true)
            echo "$OUTPUT" >> cli-benchmark-output.txt

            # Parse the output line for this length
            SOL=$(echo "$OUTPUT" | sed -n 's/.*: \([0-9]*\) solutions.*/\1/p')
            SRC=$(echo "$OUTPUT" | sed -n 's/.* \([0-9]\+\) searched.*/\1/p')
            TIME_RAW=$(echo "$OUTPUT" | sed -n 's/.*searched,[[:space:]]*\(.*\)/\1/p')

            if [ -n "$SOL" ]; then
              echo "${len}:${SOL}:${SRC}:${TIME_RAW}" >> current-bench-results.txt
            fi
          done

          # Build summary table
          echo "| Length | Solutions | Expressions Searched | Time |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|---------------------|------|" >> $GITHUB_STEP_SUMMARY

          while IFS=: read -r LEN SOL SRC TIME_RAW; do
            echo "| $LEN | $SOL | $SRC | $TIME_RAW |" >> $GITHUB_STEP_SUMMARY
          done < current-bench-results.txt

          echo "" >> $GITHUB_STEP_SUMMARY

          # Add raw output in collapsible section
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw CLI Benchmark Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cli-benchmark-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Run parallel CLI benchmarks
        run: |
          echo "## 📊 CLI Parallel Solver Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Parallel solver uses auto-detected thread count (num_cpus)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          > current-parallel-bench-results.txt
          for len in 3 4 5 6 7 8; do
            echo "Running parallel CLI benchmark for length $len..."
            OUTPUT=$(./target/release/sumzle-solver bench -l $len --parallel 2>&1 || true)
            echo "$OUTPUT" >> cli-parallel-benchmark-output.txt

            SOL=$(echo "$OUTPUT" | sed -n 's/.*: \([0-9]*\) solutions.*/\1/p')
            SRC=$(echo "$OUTPUT" | sed -n 's/.* \([0-9]\+\) searched.*/\1/p')
            TIME_RAW=$(echo "$OUTPUT" | sed -n 's/.*searched,[[:space:]]*\(.*\)/\1/p')

            if [ -n "$SOL" ]; then
              echo "${len}:${SOL}:${SRC}:${TIME_RAW}" >> current-parallel-bench-results.txt
            fi
          done

          # Build summary table
          echo "| Length | Solutions | Expressions Searched | Time |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|---------------------|------|" >> $GITHUB_STEP_SUMMARY

          while IFS=: read -r LEN SOL SRC TIME_RAW; do
            echo "| $LEN | $SOL | $SRC | $TIME_RAW |" >> $GITHUB_STEP_SUMMARY
          done < current-parallel-bench-results.txt

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Parallel CLI Benchmark Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cli-parallel-benchmark-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------------
      #  Baseline (main branch) benchmarks – PR only
      # ---------------------------------------------------------------

      - name: Checkout base ref for baseline
        if: github.event_name == 'pull_request'
        run: |
          git worktree add $RUNNER_TEMP/baseline ${{ github.base_ref }}

      - name: Build baseline release binary
        if: github.event_name == 'pull_request'
        run: |
          cd $RUNNER_TEMP/baseline
          cargo build --release --target-dir $RUNNER_TEMP/baseline-target

      - name: Run CLI benchmarks (baseline)
        if: github.event_name == 'pull_request'
        run: |
          BASELINE_BIN="$RUNNER_TEMP/baseline-target/release/sumzle-solver"

          > baseline-bench-results.txt
          for len in 3 4 5 6 7 8; do
            echo "Running baseline CLI benchmark for length $len..."
            OUTPUT=$($BASELINE_BIN bench -l $len 2>&1 || true)
            echo "$OUTPUT" >> baseline-benchmark-output.txt

            SOL=$(echo "$OUTPUT" | sed -n 's/.*: \([0-9]*\) solutions.*/\1/p')
            SRC=$(echo "$OUTPUT" | sed -n 's/.* \([0-9]\+\) searched.*/\1/p')
            TIME_RAW=$(echo "$OUTPUT" | sed -n 's/.*searched,[[:space:]]*\(.*\)/\1/p')

            if [ -n "$SOL" ]; then
              echo "${len}:${SOL}:${SRC}:${TIME_RAW}" >> baseline-bench-results.txt
            fi
          done

          > baseline-parallel-bench-results.txt
          # Check if baseline binary supports --parallel flag
          if $BASELINE_BIN bench --help 2>&1 | grep -q -- '--parallel'; then
            for len in 3 4 5 6 7 8; do
              echo "Running baseline parallel CLI benchmark for length $len..."
              OUTPUT=$($BASELINE_BIN bench -l $len --parallel 2>&1 || true)
              echo "$OUTPUT" >> baseline-parallel-benchmark-output.txt

              SOL=$(echo "$OUTPUT" | sed -n 's/.*: \([0-9]*\) solutions.*/\1/p')
              SRC=$(echo "$OUTPUT" | sed -n 's/.* \([0-9]\+\) searched.*/\1/p')
              TIME_RAW=$(echo "$OUTPUT" | sed -n 's/.*searched,[[:space:]]*\(.*\)/\1/p')

              if [ -n "$SOL" ]; then
                echo "${len}:${SOL}:${SRC}:${TIME_RAW}" >> baseline-parallel-bench-results.txt
              fi
            done
          else
            echo "Baseline binary does not support --parallel, skipping baseline parallel benchmarks."
          fi

      # ---------------------------------------------------------------
      #  Benchmark comparison (PR only)
      # ---------------------------------------------------------------

      - name: Compare benchmark results with main branch
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          python3 << 'PYEOF'
          import re, os

          def parse_time_ns(time_str):
              """Convert a time string like 275us, 2.2ms, 367ms to nanoseconds."""
              if not time_str or time_str.strip() == "":
                  return None
              time_str = time_str.strip()
              # Handle micro sign (µ) and ASCII 'us'
              m = re.match(r"^([0-9.]+)\s*(ns|µs|us|ms|s)$", time_str)
              if not m:
                  return None
              value = float(m.group(1))
              unit = m.group(2)
              multipliers = {"ns": 1, "µs": 1e3, "us": 1e3, "ms": 1e6, "s": 1e9}
              return value * multipliers.get(unit, 1)

          def format_time(ns):
              """Format nanoseconds to a human-readable string."""
              if ns is None:
                  return "N/A"
              if ns < 1e3:
                  return f"{ns:.0f}ns"
              elif ns < 1e6:
                  return f"{ns/1e3:.1f}us"
              elif ns < 1e9:
                  return f"{ns/1e6:.1f}ms"
              else:
                  return f"{ns/1e9:.2f}s"

          def format_diff_pct(current_ns, baseline_ns):
              """Format percentage difference with emoji indicator."""
              if current_ns is None or baseline_ns is None or baseline_ns == 0:
                  return "N/A", "⚪"
              pct = ((current_ns - baseline_ns) / baseline_ns) * 100
              if pct > 10:
                  emoji = "🔴"
              elif pct > 5:
                  emoji = "🟡"
              elif pct < -10:
                  emoji = "🟢"
              elif pct < -5:
                  emoji = "🔵"
              else:
                  emoji = "⚪"
              sign = "+" if pct >= 0 else ""
              return f"{sign}{pct:.1f}%", emoji

          def load_results(filepath):
              """Load benchmark results from colon-separated file."""
              results = {}
              try:
                  with open(filepath) as f:
                      for line in f:
                          parts = line.strip().split(":", 3)
                          if len(parts) == 4:
                              length = parts[0]
                              results[length] = {
                                  "solutions": int(parts[1]),
                                  "searched": int(parts[2]),
                                  "time_raw": parts[3],
                                  "time_ns": parse_time_ns(parts[3]),
                              }
              except FileNotFoundError:
                  pass
              return results

          current = load_results("current-bench-results.txt")
          current_par = load_results("current-parallel-bench-results.txt")
          baseline = load_results("baseline-bench-results.txt")
          baseline_par = load_results("baseline-parallel-bench-results.txt")

          pr_branch = os.environ.get("PR_BRANCH", "PR")
          base_branch = os.environ.get("BASE_BRANCH", "main")

          has_mismatch = False
          has_regression = False

          lines = []

          # =============================================================
          #  Section 1: Sequential Performance Comparison
          # =============================================================
          lines.append("## 📊 Sequential Benchmark Comparison with Main Branch")
          lines.append("")
          lines.append(f"Comparing **{pr_branch}** (PR) vs **{base_branch}** (baseline)")
          lines.append("")
          lines.append("| Length | Metric | PR | Main | Match | Diff |")
          lines.append("|--------|--------|-----|------|-------|------|")

          for length in ["3", "4", "5", "6", "7", "8"]:
              cur = current.get(length)
              base = baseline.get(length)

              if not cur or not base:
                  lines.append(f"| {length} | — | — | — | ⚠️ Missing | — |")
                  continue

              # Solutions comparison
              sol_match = cur["solutions"] == base["solutions"]
              sol_icon = "✅" if sol_match else "❌"
              if not sol_match:
                  has_mismatch = True
                  sol_diff = f'{cur["solutions"] - base["solutions"]:+d}'
              else:
                  sol_diff = "="
              lines.append(f'| {length} | Solutions | {cur["solutions"]} | {base["solutions"]} | {sol_icon} | {sol_diff} |')

              # Expressions Searched comparison
              src_match = cur["searched"] == base["searched"]
              src_icon = "✅" if src_match else "❌"
              if not src_match:
                  has_mismatch = True
                  src_diff = f'{cur["searched"] - base["searched"]:+d}'
              else:
                  src_diff = "="
              lines.append(f'| {length} | Expr Searched | {cur["searched"]} | {base["searched"]} | {src_icon} | {src_diff} |')

              # Time comparison
              time_diff_pct, time_emoji = format_diff_pct(cur["time_ns"], base["time_ns"])
              if time_emoji in ("🔴", "🟡"):
                  has_regression = True
              cur_time_str = format_time(cur["time_ns"]) if cur["time_ns"] is not None else cur["time_raw"]
              base_time_str = format_time(base["time_ns"]) if base["time_ns"] is not None else base["time_raw"]
              lines.append(f"| {length} | Time | {cur_time_str} | {base_time_str} | {time_emoji} | {time_diff_pct} |")

          lines.append("")

          # =============================================================
          #  Section 2: Parallel Performance Comparison
          # =============================================================
          if baseline_par:
              lines.append("## 📊 Parallel Benchmark Comparison with Main Branch")
              lines.append("")
              lines.append(f"Comparing **{pr_branch}** (PR) vs **{base_branch}** (baseline)")
              lines.append("")
              lines.append("| Length | Metric | PR | Main | Match | Diff |")
              lines.append("|--------|--------|-----|------|-------|------|")

              for length in ["3", "4", "5", "6", "7", "8"]:
                  cur = current_par.get(length)
                  base = baseline_par.get(length)

                  if not cur or not base:
                      lines.append(f"| {length} | — | — | — | ⚠️ Missing | — |")
                      continue

                  sol_match = cur["solutions"] == base["solutions"]
                  sol_icon = "✅" if sol_match else "❌"
                  if not sol_match:
                      has_mismatch = True
                      sol_diff = f'{cur["solutions"] - base["solutions"]:+d}'
                  else:
                      sol_diff = "="
                  lines.append(f'| {length} | Solutions | {cur["solutions"]} | {base["solutions"]} | {sol_icon} | {sol_diff} |')

                  src_match = cur["searched"] == base["searched"]
                  src_icon = "✅" if src_match else "❌"
                  if not src_match:
                      has_mismatch = True
                      src_diff = f'{cur["searched"] - base["searched"]:+d}'
                  else:
                      src_diff = "="
                  lines.append(f'| {length} | Expr Searched | {cur["searched"]} | {base["searched"]} | {src_icon} | {src_diff} |')

                  time_diff_pct, time_emoji = format_diff_pct(cur["time_ns"], base["time_ns"])
                  if time_emoji in ("🔴", "🟡"):
                      has_regression = True
                  cur_time_str = format_time(cur["time_ns"]) if cur["time_ns"] is not None else cur["time_raw"]
                  base_time_str = format_time(base["time_ns"]) if base["time_ns"] is not None else base["time_raw"]
                  lines.append(f"| {length} | Time | {cur_time_str} | {base_time_str} | {time_emoji} | {time_diff_pct} |")

              lines.append("")

          # =============================================================
          #  Section 3: Sequential vs Parallel Consistency Check
          # =============================================================
          if current_par:
              lines.append("## ✅ Sequential vs Parallel Consistency Check")
              lines.append("")
              lines.append("Verifying that the parallel solver produces identical results to the sequential solver (auto thread count).")
              lines.append("")
              lines.append("| Length | Metric | Sequential | Parallel | Match |")
              lines.append("|--------|--------|------------|----------|-------|")

              for length in ["3", "4", "5", "6", "7", "8"]:
                  seq = current.get(length)
                  par = current_par.get(length)

                  if not seq or not par:
                      lines.append(f"| {length} | — | — | — | ⚠️ Missing |")
                      continue

                  sol_match = seq["solutions"] == par["solutions"]
                  sol_icon = "✅" if sol_match else "❌"
                  if not sol_match:
                      has_mismatch = True
                  lines.append(f'| {length} | Solutions | {seq["solutions"]} | {par["solutions"]} | {sol_icon} |')

                  src_match = seq["searched"] == par["searched"]
                  src_icon = "✅" if src_match else "❌"
                  if not src_match:
                      has_mismatch = True
                  lines.append(f'| {length} | Expr Searched | {seq["searched"]} | {par["searched"]} | {src_icon} |')

                  # Speedup comparison
                  if seq["time_ns"] and par["time_ns"] and par["time_ns"] > 0:
                      speedup = seq["time_ns"] / par["time_ns"]
                      speedup_str = f"{speedup:.2f}x"
                  else:
                      speedup_str = "N/A"
                  lines.append(f'| {length} | Time | {format_time(seq["time_ns"]) if seq["time_ns"] else seq["time_raw"]} | {format_time(par["time_ns"]) if par["time_ns"] else par["time_raw"]} | ⚡ {speedup_str} |')

              lines.append("")

          # Add legend
          lines.append("<details>")
          lines.append("<summary>📖 Comparison Legend</summary>")
          lines.append("")
          lines.append("| Icon | Meaning |")
          lines.append("|------|---------|")
          lines.append("| ✅ | Values match (correctness OK) |")
          lines.append("| ❌ | Values differ (correctness concern) |")
          lines.append("| 🟢 | Time improved > 10% |")
          lines.append("| 🔵 | Time improved 5-10% |")
          lines.append("| ⚪ | Time within ±5% (noise range) |")
          lines.append("| 🟡 | Time regressed 5-10% |")
          lines.append("| 🔴 | Time regressed > 10% |")
          lines.append("| ⚡ | Parallel speedup vs sequential |")
          lines.append("")
          lines.append("</details>")
          lines.append("")

          # Add warnings / all-clear
          if has_mismatch:
              lines.append("> ⚠️ **Solutions or Expressions Searched count mismatch detected!** This may indicate a correctness issue.")
              lines.append("")
          if has_regression:
              lines.append("> 🔴 **Performance regression detected!** One or more benchmarks show > 5% slowdown compared to main.")
              lines.append("")
          if not has_mismatch and not has_regression:
              lines.append("> ✅ **No correctness or significant performance issues detected.**")
              lines.append("")

          # Add raw baseline output in collapsible section
          lines.append("<details>")
          lines.append("<summary>📝 Raw Baseline (Main Branch) Benchmark Output</summary>")
          lines.append("")
          lines.append("```")
          try:
              with open("baseline-benchmark-output.txt") as f:
                  lines.append(f.read())
          except FileNotFoundError:
              lines.append("(no baseline output)")
          lines.append("```")
          lines.append("")
          lines.append("</details>")

          lines.append("<details>")
          lines.append("<summary>📝 Raw Baseline Parallel Benchmark Output</summary>")
          lines.append("")
          lines.append("```")
          try:
              with open("baseline-parallel-benchmark-output.txt") as f:
                  lines.append(f.read())
          except FileNotFoundError:
              lines.append("(no baseline parallel output)")
          lines.append("```")
          lines.append("")
          lines.append("</details>")

          # Write to step summary
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")

          # Print summary for the log
          if has_mismatch:
              print("WARNING: Solutions or Expressions Searched mismatch detected!")
          if has_regression:
              print("WARNING: Performance regression detected!")
          if not has_mismatch and not has_regression:
              print("All benchmark comparisons passed.")
          PYEOF

      # ---------------------------------------------------------------
      #  Criterion micro-benchmarks (all events)
      # ---------------------------------------------------------------

      - name: Run Criterion benchmarks
        run: |
          echo "## 📈 Criterion Micro-Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run all criterion benchmarks with minimal sample count for CI speed.
          # Use --bench benchmark to only run the Criterion benchmark target,
          # avoiding the lib unit-test harness which doesn't understand --quick.
          cargo bench --bench benchmark -- --quick 2>&1 | tee criterion-output.txt || true

          # Parse criterion output and build summary table
          echo "| Benchmark Group | Benchmark | Mean Time |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|-----------|-----------|" >> $GITHUB_STEP_SUMMARY

          # Extract benchmark results from criterion output
          grep -E '^\S+.*time:\s+\[' criterion-output.txt | while IFS= read -r LINE; do
            BENCH_NAME=$(echo "$LINE" | sed -E 's/\s+time:.*//')
            MEAN_TIME=$(echo "$LINE" | sed -E 's/.*time:\s+\[\s*([^]]+)\].*/\1/' | awk '{print $1, $2}')
            GROUP=$(echo "$BENCH_NAME" | cut -d'/' -f1)
            BENCH=$(echo "$BENCH_NAME" | cut -d'/' -f2-)
            echo "| $GROUP | $BENCH | $MEAN_TIME |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY

          # Add raw output in collapsible section
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Criterion Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat criterion-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Finalize benchmark summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ Benchmarks run on GitHub Actions \`ubuntu-latest\` runner. Results may vary due to shared hardware." >> $GITHUB_STEP_SUMMARY

  # Release builds only run on push (not PRs).
  # Each target produces a single combined archive containing the backend
  # binary AND the pre-built frontend (frontend/dist), so end users can
  # download one file and run the full app — no separate frontend build
  # or reverse proxy required. The server's get_frontend_dir() resolution
  # looks for <exe_dir>/frontend/dist automatically, so unpacking the
  # archive and running the binary "just works".
  build-release:
    name: Build Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [test, check]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sumzle-solver
            asset_name: sumzle-solver-linux-x86_64
            archive_ext: tar.gz
            archive_cmd: tar -czf
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: sumzle-solver
            asset_name: sumzle-solver-linux-aarch64
            archive_ext: tar.gz
            archive_cmd: tar -czf
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sumzle-solver.exe
            asset_name: sumzle-solver-windows-x86_64
            archive_ext: zip
            archive_cmd: 7z a -tzip
          - os: macOS-latest
            target: x86_64-apple-darwin
            artifact_name: sumzle-solver
            asset_name: sumzle-solver-macos-x86_64
            archive_ext: tar.gz
            archive_cmd: tar -czf
          - os: macOS-latest
            target: aarch64-apple-darwin
            artifact_name: sumzle-solver
            asset_name: sumzle-solver-macos-aarch64
            archive_ext: tar.gz
            archive_cmd: tar -czf

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ---------------------------------------------------------------------
      #  Build the frontend. The output (frontend/dist) is platform-
      #  independent static HTML/JS/CSS, so we build it once per target
      #  inside the matrix (parallelized by GitHub) and bundle it next to
      #  the binary. The Rust server auto-discovers <exe_dir>/frontend/dist.
      # ---------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---------------------------------------------------------------------
      #  Stage the combined package: binary + frontend/dist + README +
      #  launcher. Layout matches what get_frontend_dir() expects so the
      #  server serves the UI out of the box.
      # ---------------------------------------------------------------------
      - name: Stage combined package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          set -euo pipefail
          STAGE="staging/${{ matrix.asset_name }}"
          mkdir -p "$STAGE/frontend"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$STAGE/"
          cp -r frontend/dist "$STAGE/frontend/"
          # Per-platform launcher + README
          cat > "$STAGE/run.sh" << 'LAUNCHER'
          #!/usr/bin/env bash
          # Launch the Sumzle HPC Solver backend, which also serves the
          # bundled frontend at http://localhost:3000
          set -euo pipefail
          cd "$(dirname "$0")"
          PORT="${PORT:-3000}"
          HOST="${HOST:-0.0.0.0}"
          exec ./sumzle-solver serve --host "$HOST" --port "$PORT"
          LAUNCHER
          chmod +x "$STAGE/run.sh"
          cat > "$STAGE/README.md" << 'README'
          # Sumzle HPC Solver

          A high-performance solver for the Sumzle equation puzzle, with a
          built-in web frontend. This archive contains everything you need —
          no build step required.

          ## Quick start (Unix)

          ```bash
          ./run.sh
          # or directly:
          ./sumzle-solver serve --host 0.0.0.0 --port 3000
          ```

          Then open http://localhost:3000 in your browser. The backend
          automatically serves the bundled frontend from `frontend/dist`.

          ## Contents

          | File | Purpose |
          |------|---------|
          | `sumzle-solver` | The backend binary (Rust release build) |
          | `frontend/dist/` | Pre-built web frontend (static HTML/JS/CSS) |
          | `run.sh` / `run.bat` | Launcher script |
          | `README.md` | This file |

          ## CLI usage

          ```bash
          ./sumzle-solver solve -i puzzle.json -t 0 -f json
          ./sumzle-solver validate "1+2=3"
          ./sumzle-solver eval "5!"
          ./sumzle-solver bench -l 5 6 7
          ```

          ## Custom frontend location

          Set the `STATIC_DIR` environment variable to serve the frontend
          from a custom directory:

          ```bash
          STATIC_DIR=/path/to/dist ./sumzle-solver serve
          ```

          ## License

          MIT
          README

      - name: Stage combined package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="staging/${{ matrix.asset_name }}"
          mkdir -p "$STAGE/frontend"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$STAGE/"
          cp -r frontend/dist "$STAGE/frontend/"
          cat > "$STAGE/run.bat" << 'LAUNCHER'
          @echo off
          REM Launch the Sumzle HPC Solver backend, which also serves the
          REM bundled frontend at http://localhost:3000
          cd /d "%~dp0"
          if "%PORT%"=="" set PORT=3000
          if "%HOST%"=="" set HOST=0.0.0.0
          sumzle-solver.exe serve --host %HOST% --port %PORT%
          LAUNCHER
          cat > "$STAGE/README.md" << 'README'
          # Sumzle HPC Solver

          A high-performance solver for the Sumzle equation puzzle, with a
          built-in web frontend. This archive contains everything you need —
          no build step required.

          ## Quick start (Windows)

          ```cmd
          run.bat
          :: or directly:
          sumzle-solver.exe serve --host 0.0.0.0 --port 3000
          ```

          Then open http://localhost:3000 in your browser. The backend
          automatically serves the bundled frontend from `frontend\dist`.

          ## Contents

          | File | Purpose |
          |------|---------|
          | `sumzle-solver.exe` | The backend binary (Rust release build) |
          | `frontend\dist\` | Pre-built web frontend (static HTML/JS/CSS) |
          | `run.bat` | Launcher script |
          | `README.md` | This file |

          ## CLI usage

          ```cmd
          sumzle-solver.exe solve -i puzzle.json -t 0 -f json
          sumzle-solver.exe validate "1+2=3"
          sumzle-solver.exe eval "5!"
          sumzle-solver.exe bench -l 5 6 7
          ```

          ## Custom frontend location

          Set the `STATIC_DIR` environment variable to serve the frontend
          from a custom directory:

          ```cmd
          set STATIC_DIR=C:\path\to\dist
          sumzle-solver.exe serve
          ```

          ## License

          MIT
          README

      - name: Create combined archive
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          ARCHIVE="${{ matrix.asset_name }}.${{ matrix.archive_ext }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a -tzip "$ARCHIVE" "${{ matrix.asset_name }}"
          else
            tar -czf "$ARCHIVE" "${{ matrix.asset_name }}"
          fi
          echo "Created $ARCHIVE"
          ls -la "$ARCHIVE"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: staging/${{ matrix.asset_name }}.${{ matrix.archive_ext }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-release, frontend]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release assets
        run: |
          echo "## 📦 Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each archive bundles the backend binary AND the pre-built frontend (frontend/dist). Unpack and run — no build step required." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Platform |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|" >> $GITHUB_STEP_SUMMARY
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *linux-x86_64*)   platform="Linux x86_64" ;;
              *linux-aarch64*)  platform="Linux ARM64" ;;
              *windows-x86_64*) platform="Windows x86_64" ;;
              *macos-x86_64*)   platform="macOS x86_64" ;;
              *macos-aarch64*)  platform="macOS ARM64" ;;
              *)                platform="Other" ;;
            esac
            size=$(stat -c %s "$f" 2>/dev/null || stat -f %z "$f" 2>/dev/null || echo 0)
            if [ "$size" -ge 1048576 ]; then
              size_hr="$(awk "BEGIN {printf \"%.1f MB\", $size/1048576}")"
            elif [ "$size" -ge 1024 ]; then
              size_hr="$(awk "BEGIN {printf \"%.1f KB\", $size/1024}")"
            else
              size_hr="$size B"
            fi
            echo "| \`$base\` ($size_hr) | $platform |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          find artifacts -type f | sort >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body: |
            ## Combined release archives

            Each archive bundles the backend binary AND the pre-built web
            frontend — **unpack and run, no build step required**.

            | Platform | Archive |
            |----------|---------|
            | Linux x86_64 | `sumzle-solver-linux-x86_64.tar.gz` |
            | Linux ARM64 | `sumzle-solver-linux-aarch64.tar.gz` |
            | Windows x86_64 | `sumzle-solver-windows-x86_64.zip` |
            | macOS x86_64 | `sumzle-solver-macos-x86_64.tar.gz` |
            | macOS ARM64 | `sumzle-solver-macos-aarch64.tar.gz` |

            ## Quick start

            **Unix** (Linux / macOS):
            ```bash
            tar -xzf sumzle-solver-<platform>.tar.gz
            cd sumzle-solver-<platform>
            ./run.sh
            ```

            **Windows**:
            ```cmd
            Expand-Archive sumzle-solver-windows-x86_64.zip
            cd sumzle-solver-windows-x86_64
            run.bat
            ```

            Then open http://localhost:3000 in your browser. The backend
            automatically serves the bundled frontend from `frontend/dist`.

            See the in-archive `README.md` for CLI usage and advanced options.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
