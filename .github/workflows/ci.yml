name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast gate: format + clippy + cargo check
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo check

  test:
    name: Test on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macOS-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose 2>&1 | tee test-output.txt
        shell: bash

      - name: Create test summary
        if: always()
        shell: bash
        run: |
          echo "## 🧪 Test Results — \`${{ matrix.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`${{ matrix.os }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`${{ matrix.target }}\` |" >> $GITHUB_STEP_SUMMARY

          sed 's/\r$//' test-output.txt | awk '
            BEGIN { suite_count=0; result_count=0; sumzle_count=0 }

            /^[[:space:]]*Doc-tests[[:space:]]/ {
              suite_name[suite_count++] = "Doc-tests"
            }

            /Running/ && /target[\/\\]debug[\/\\]deps[\/\\]/ && !/--crate-name/ {
              path = $0
              sub(/.*target[\/\\]debug[\/\\]deps[\/\\]/, "", path)
              sub(/[\x27`"].*$/, "", path)
              sub(/-[^-]+$/, "", path)
              sub(/\.exe$/, "", path)

              sumzle_count++
              if (path == "sumzle_solver") {
                if (sumzle_count == 1) suite_name[suite_count++] = "unittests (lib)"
                else                   suite_name[suite_count++] = "unittests (bin)"
              } else if (path == "consistency") {
                suite_name[suite_count++] = "integration tests"
              } else {
                suite_name[suite_count++] = path
              }
            }

            /^test result:/ {
              idx = result_count
              for (i=1; i<=NF; i++) {
                if ($i ~ /^[0-9]+$/ && $(i+1) ~ /^passed/)  passed[idx]  = $i+0
                if ($i ~ /^[0-9]+$/ && $(i+1) ~ /^failed/)  failed[idx]  = $i+0
                if ($i ~ /^[0-9]+$/ && $(i+1) ~ /^ignored/) ignored[idx] = $i+0
                if ($i ~ /^[0-9]+$/ && $(i+1) ~ /^measured/) measured[idx] = $i+0
                if ($i ~ /^[0-9.]+s$/) duration[idx] = $i
              }
              result_count++
            }

            END {
              tp=0; tf=0; ti=0; tm=0
              for (i=0; i<result_count; i++) {
                p  = passed[i]+0;  f = failed[i]+0
                ig = ignored[i]+0; d = duration[i]
                if (d == "") d = "N/A"
                tp += p; tf += f; ti += ig; tm += measured[i]+0
                icon = (f > 0) ? "❌" : "✅"
                name = (i < suite_count) ? suite_name[i] : "Suite #" (i+1)
                printf "| → %s | %s %d passed, %d failed, %d ignored (%s) |\n", \
                       name, icon, p, f, ig, d
              }
              total = tp + tf + ti + tm
              printf "| **Total tests** | **%d** |\n", total
              printf "| **Passed** | **%d** |\n", tp
              printf "| **Failed** | **%d** |\n", tf
              printf "| **Ignored** | **%d** |\n", ti
              printf "| **Measured** | **%d** |\n", tm

              if (tf > 0) printf "\n> ⚠️ **%d test(s) failed!**\n", tf
              else        printf "\n> ✅ All tests passed!\n"
            }
          ' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Test Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      # ---------------------------------------------------------------
      #  Current branch (PR head or push branch) benchmarks
      # ---------------------------------------------------------------

      - name: Build release binary
        run: cargo build --release

      - name: Run CLI benchmarks
        run: |
          echo "## 📊 CLI Solver Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run CLI benchmarks for all supported lengths and save results
          # in a machine-parseable format: length:solutions:searched:time_raw
          > current-bench-results.txt
          for len in 3 4 5 6 7 8; do
            echo "Running CLI benchmark for length $len..."
            OUTPUT=$(./target/release/sumzle-solver bench -l $len 2>&1 || true)
            echo "$OUTPUT" >> cli-benchmark-output.txt

            # Parse the output line for this length
            SOL=$(echo "$OUTPUT" | sed -n 's/.*: \([0-9]*\) solutions.*/\1/p')
            SRC=$(echo "$OUTPUT" | sed -n 's/.* \([0-9]\+\) searched.*/\1/p')
            TIME_RAW=$(echo "$OUTPUT" | sed -n 's/.*searched,[[:space:]]*\(.*\)/\1/p')

            if [ -n "$SOL" ]; then
              echo "${len}:${SOL}:${SRC}:${TIME_RAW}" >> current-bench-results.txt
            fi
          done

          # Build summary table
          echo "| Length | Solutions | Expressions Searched | Time |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|---------------------|------|" >> $GITHUB_STEP_SUMMARY

          while IFS=: read -r LEN SOL SRC TIME_RAW; do
            echo "| $LEN | $SOL | $SRC | $TIME_RAW |" >> $GITHUB_STEP_SUMMARY
          done < current-bench-results.txt

          echo "" >> $GITHUB_STEP_SUMMARY

          # Add raw output in collapsible section
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw CLI Benchmark Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cli-benchmark-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Run parallel CLI benchmarks
        run: |
          echo "## 📊 CLI Parallel Solver Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Parallel solver uses auto-detected thread count (num_cpus)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          > current-parallel-bench-results.txt
          for len in 3 4 5 6 7 8; do
            echo "Running parallel CLI benchmark for length $len..."
            OUTPUT=$(./target/release/sumzle-solver bench -l $len --parallel 2>&1 || true)
            echo "$OUTPUT" >> cli-parallel-benchmark-output.txt

            SOL=$(echo "$OUTPUT" | sed -n 's/.*: \([0-9]*\) solutions.*/\1/p')
            SRC=$(echo "$OUTPUT" | sed -n 's/.* \([0-9]\+\) searched.*/\1/p')
            TIME_RAW=$(echo "$OUTPUT" | sed -n 's/.*searched,[[:space:]]*\(.*\)/\1/p')

            if [ -n "$SOL" ]; then
              echo "${len}:${SOL}:${SRC}:${TIME_RAW}" >> current-parallel-bench-results.txt
            fi
          done

          # Build summary table
          echo "| Length | Solutions | Expressions Searched | Time |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|---------------------|------|" >> $GITHUB_STEP_SUMMARY

          while IFS=: read -r LEN SOL SRC TIME_RAW; do
            echo "| $LEN | $SOL | $SRC | $TIME_RAW |" >> $GITHUB_STEP_SUMMARY
          done < current-parallel-bench-results.txt

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Parallel CLI Benchmark Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cli-parallel-benchmark-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------------
      #  PR9 feature benchmarks: Top-N + Streaming (lengths 6–9)
      #  These exercise ParallelSolver::solve_top_n and
      #  ParallelSolver::solve_to_writer, the two new code paths
      #  introduced by PR9 (arena/perf-optimize-solver-20260612).
      # ---------------------------------------------------------------

      - name: Generate benchmark puzzle files
        run: |
          # No-constraint puzzles of each length — the solver enumerates
          # every valid expression so default / streaming / top-N all run
          # against identical workloads.
          for len in 6 7 8 9; do
            printf '{"length":%d,"rows":[]}\n' "$len" > "puzzle-len${len}.json"
          done

      - name: Run Top-N benchmarks (lengths 6–9, N=100 and N=1000)
        run: |
          echo "## 📊 Top-N Solver Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Bounded min-heap of the N highest-probability solutions. Memory is O(threads·N) regardless of total solution count." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          > current-topn-bench-results.txt
          > topn-benchmark-output.txt
          for len in 6 7 8 9; do
            for n in 100 1000; do
              echo "Running top-N benchmark: L=$len N=$n..."
              OUTPUT=$(./target/release/sumzle-solver solve -i puzzle-len${len}.json -t 0 --top $n -f text 2>&1 || true)
              echo "$OUTPUT" >> topn-benchmark-output.txt

              SOL=$(echo "$OUTPUT" | sed -n 's/^Solutions found: \([0-9]*\).*/\1/p')
              SRC=$(echo "$OUTPUT" | sed -n 's/^Expressions searched: \([0-9]*\).*/\1/p')
              TIME_MS=$(echo "$OUTPUT" | sed -n 's/^Time: \([0-9]*\)ms.*/\1/p')
              SPEED=$(echo "$OUTPUT" | sed -n 's/^Speed: \([0-9]*\) expr\/s.*/\1/p')

              if [ -n "$SOL" ]; then
                echo "${len}:${n}:${SOL}:${SRC}:${TIME_MS}:${SPEED}" >> current-topn-bench-results.txt
              fi
            done
          done

          echo "| Length | N | Solutions (kept) | Expr Searched | Time (ms) | Speed (expr/s) |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|------------------|---------------|-----------|----------------|" >> $GITHUB_STEP_SUMMARY
          while IFS=: read -r LEN N SOL SRC TIME_MS SPEED; do
            echo "| $LEN | $N | $SOL | $SRC | $TIME_MS | $SPEED |" >> $GITHUB_STEP_SUMMARY
          done < current-topn-bench-results.txt
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Top-N Benchmark Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat topn-benchmark-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Run Streaming benchmarks (lengths 6–9)
        run: |
          echo "## 📊 Streaming Solver Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> All solutions streamed to a JSONL file. Memory is bounded (~constant RSS) regardless of total solution count." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          > current-stream-bench-results.txt
          > stream-benchmark-output.txt
          for len in 6 7 8 9; do
            echo "Running streaming benchmark: L=$len..."
            OUTPUT=$(./target/release/sumzle-solver solve -i puzzle-len${len}.json -t 0 --output "stream-len${len}.jsonl" 2>&1 || true)
            echo "$OUTPUT" >> stream-benchmark-output.txt

            SOL=$(echo "$OUTPUT" | sed -n 's/^Solutions found: \([0-9]*\).*/\1/p')
            SRC=$(echo "$OUTPUT" | sed -n 's/^Expressions searched: \([0-9]*\).*/\1/p')
            TIME_MS=$(echo "$OUTPUT" | sed -n 's/^Time: \([0-9]*\)ms.*/\1/p')
            SPEED=$(echo "$OUTPUT" | sed -n 's/^Speed: \([0-9]*\) expr\/s.*/\1/p')
            FILE_BYTES=$(stat -c %s "stream-len${len}.jsonl" 2>/dev/null || echo 0)

            if [ -n "$SOL" ]; then
              echo "${len}:${SOL}:${SRC}:${TIME_MS}:${SPEED}:${FILE_BYTES}" >> current-stream-bench-results.txt
            fi
          done

          echo "| Length | Solutions | Expr Searched | Time (ms) | Speed (expr/s) | Output Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|---------------|-----------|----------------|-------------|" >> $GITHUB_STEP_SUMMARY
          while IFS=: read -r LEN SOL SRC TIME_MS SPEED FILE_BYTES; do
            if [ "$FILE_BYTES" -ge 1048576 ]; then
              SIZE_HR="$(awk "BEGIN {printf \"%.1f MB\", $FILE_BYTES/1048576}")"
            elif [ "$FILE_BYTES" -ge 1024 ]; then
              SIZE_HR="$(awk "BEGIN {printf \"%.1f KB\", $FILE_BYTES/1024}")"
            else
              SIZE_HR="$FILE_BYTES B"
            fi
            echo "| $LEN | $SOL | $SRC | $TIME_MS | $SPEED | $SIZE_HR |" >> $GITHUB_STEP_SUMMARY
          done < current-stream-bench-results.txt
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Streaming Benchmark Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat stream-benchmark-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Write memory measurement helper
        run: |
          cat > measure_rss.py << 'PYEOF'
          #!/usr/bin/env python3
          """Run a command and report wall time + peak RSS (KB).

          Usage: measure_rss.py [--quiet] <cmd> [args...]
          With --quiet, child stdout/stderr are discarded and the only output
          is the final PEAK_RSS_KB=... line — useful when the child produces
          huge output (e.g. the solver in -f text mode for L8+).

          Reads /proc/<pid>/status for VmHWM (high-water mark of resident set
          size), which the kernel updates live as RSS grows.
          """
          import sys, time, subprocess, threading

          def read_vmhwm_kb(pid):
              try:
                  with open(f"/proc/{pid}/status") as f:
                      for line in f:
                          if line.startswith("VmHWM:"):
                              return int(line.split()[1])
              except (FileNotFoundError, ProcessLookupError, ValueError, IndexError):
                  pass
              return 0

          def main():
              quiet = False
              args = sys.argv[1:]
              if args and args[0] == "--quiet":
                  quiet = True
                  args = args[1:]
              if not args:
                  print("usage: measure_rss.py [--quiet] <cmd> [args...]", file=sys.stderr)
                  sys.exit(2)
              proc = subprocess.Popen(args, stdout=subprocess.PIPE,
                                      stderr=subprocess.PIPE, text=True)
              def pump(src, dst):
                  try:
                      for chunk in iter(lambda: src.read(4096), ""):
                          if not quiet:
                              dst.write(chunk); dst.flush()
                  except Exception:
                      pass
              t_out = threading.Thread(target=pump, args=(proc.stdout, sys.stdout), daemon=True)
              t_err = threading.Thread(target=pump, args=(proc.stderr, sys.stderr), daemon=True)
              t_out.start(); t_err.start()
              peak = 0
              start = time.monotonic()
              while proc.poll() is None:
                  v = read_vmhwm_kb(proc.pid)
                  if v > peak:
                      peak = v
                  time.sleep(0.01)
              v = read_vmhwm_kb(proc.pid)
              if v > peak:
                  peak = v
              wall_ms = int((time.monotonic() - start) * 1000)
              proc.wait()
              t_out.join(timeout=1); t_err.join(timeout=1)
              print(f"\nPEAK_RSS_KB={peak} WALL_MS={wall_ms} EXIT={proc.returncode}")

          if __name__ == "__main__":
              main()
          PYEOF
          chmod +x measure_rss.py

      - name: Run memory benchmarks (default / streaming / top-N, lengths 6–8)
        run: |
          echo "## 📊 Memory Benchmarks — Peak RSS by Mode" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Peak resident set size (VmHWM) per (length, mode). Lengths 6–8 chosen so the default in-memory path stays feasible on the runner." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          > current-mem-bench-results.txt
          > mem-benchmark-output.txt
          for len in 6 7 8; do
            for mode in default streaming top; do
              echo "Running memory benchmark: L=$len mode=$mode..."
              # --quiet suppresses the solver's stdout (which can be hundreds of
              # MB in default -f text mode at L8) so the captured OUTPUT holds
              # only the final PEAK_RSS_KB=... line.
              if [ "$mode" = "default" ]; then
                OUTPUT=$(python3 measure_rss.py --quiet ./target/release/sumzle-solver solve -i puzzle-len${len}.json -t 0 -f text 2>&1 || true)
              elif [ "$mode" = "streaming" ]; then
                OUTPUT=$(python3 measure_rss.py --quiet ./target/release/sumzle-solver solve -i puzzle-len${len}.json -t 0 --output "mem-stream-len${len}.jsonl" 2>&1 || true)
              else
                OUTPUT=$(python3 measure_rss.py --quiet ./target/release/sumzle-solver solve -i puzzle-len${len}.json -t 0 --top 100 -f text 2>&1 || true)
              fi
              echo "$OUTPUT" >> mem-benchmark-output.txt

              PEAK=$(echo "$OUTPUT" | sed -n 's/^PEAK_RSS_KB=\([0-9]*\).*/\1/p')
              WALL=$(echo "$OUTPUT" | sed -n 's/.*WALL_MS=\([0-9]*\).*/\1/p')
              if [ -n "$PEAK" ]; then
                echo "${len}:${mode}:${PEAK}:${WALL}" >> current-mem-bench-results.txt
              fi
            done
          done

          echo "| Length | Mode | Peak RSS | Wall Time |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|----------|-----------|" >> $GITHUB_STEP_SUMMARY
          while IFS=: read -r LEN MODE PEAK WALL; do
            if [ "$PEAK" -ge 1048576 ]; then
              RSS_HR="$(awk "BEGIN {printf \"%.1f MB\", $PEAK/1048576}")"
            elif [ "$PEAK" -ge 1024 ]; then
              RSS_HR="$(awk "BEGIN {printf \"%.1f MB\", $PEAK/1024}")"
            else
              RSS_HR="$PEAK KB"
            fi
            echo "| $LEN | $MODE | $RSS_HR | ${WALL}ms |" >> $GITHUB_STEP_SUMMARY
          done < current-mem-bench-results.txt
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Memory Benchmark Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat mem-benchmark-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------------
      #  Server multi-solve benchmark: many concurrent POST /api/solve
      #  requests against the long-running `serve` process. Exercises the
      #  HTTP path and the cross-request memory behavior that issue #20 /
      #  mimalloc address — the only path the other benches never touch.
      # ---------------------------------------------------------------

      - name: Write server benchmark helper
        run: |
          cat > bench_server.py << 'PYEOF'
          #!/usr/bin/env python3
          """Benchmark a running sumzle-solver server with concurrent /api/solve requests.

          Fires --warmup untimed requests, then --requests timed POST /api/solve requests
          at --concurrency (each request uses ?threads=N), all for one puzzle length.
          Reports throughput, mean/p50/p95 latency, the server's peak resident set (VmHWM
          from /proc/<pid>/status), and a correctness check that every response returns
          identical found_count/searched_count (the search is deterministic, so they must).

          Machine-parseable line on stdout (consumed by the workflow):
            L:requests:concurrency:throughput:mean_ms:p50_ms:p95_ms:peak_rss_kb:found:searched:errors
          Human-readable detail goes to stderr.
          """
          import argparse
          import json
          import math
          import sys
          import time
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor


          def solve_once(url, length, threads, timeout):
              """One POST /api/solve. Returns (latency_s, found, searched, ok)."""
              body = json.dumps({"length": length, "rows": []}).encode()
              req = urllib.request.Request(
                  f"{url}/api/solve?threads={threads}",
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              start = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      payload = json.loads(resp.read())
                  latency = time.monotonic() - start
                  stats = payload.get("stats", {})
                  return (
                      latency,
                      int(stats.get("found_count", -1)),
                      int(stats.get("searched_count", -1)),
                      True,
                  )
              except Exception as e:  # noqa: BLE001 - any failure counts as a failed request
                  latency = time.monotonic() - start
                  print(f"  request error: {e}", file=sys.stderr)
                  return (latency, -1, -1, False)


          def read_vmhwm_kb(pid):
              """Peak resident set (VmHWM, KB) of the server process, or 0 if unavailable."""
              if not pid:
                  return 0
              try:
                  with open(f"/proc/{pid}/status") as f:
                      for line in f:
                          if line.startswith("VmHWM:"):
                              return int(line.split()[1])
              except (FileNotFoundError, ProcessLookupError, ValueError, IndexError):
                  pass
              return 0


          def percentile(sorted_vals, pct):
              """Nearest-rank percentile of an already-sorted list."""
              if not sorted_vals:
                  return 0.0
              rank = math.ceil(pct / 100.0 * len(sorted_vals))
              k = min(max(rank, 1), len(sorted_vals)) - 1
              return sorted_vals[k]


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--url", default="http://127.0.0.1:3030")
              ap.add_argument("--pid", type=int, default=0)
              ap.add_argument("--length", type=int, required=True)
              ap.add_argument("--requests", type=int, default=40)
              ap.add_argument("--concurrency", type=int, default=4)
              ap.add_argument("--threads", type=int, default=1)
              ap.add_argument("--warmup", type=int, default=5)
              ap.add_argument("--timeout", type=float, default=120.0)
              args = ap.parse_args()

              def fire(_i):
                  return solve_once(args.url, args.length, args.threads, args.timeout)

              # Warmup (untimed): let mimalloc/Rayon reach steady state before measuring.
              if args.warmup > 0:
                  with ThreadPoolExecutor(max_workers=args.concurrency) as ex:
                      list(ex.map(fire, range(args.warmup)))

              # Timed run.
              wall_start = time.monotonic()
              with ThreadPoolExecutor(max_workers=args.concurrency) as ex:
                  results = list(ex.map(fire, range(args.requests)))
              wall = time.monotonic() - wall_start

              latencies = sorted(r[0] for r in results)
              founds = {r[1] for r in results if r[3]}
              searcheds = {r[2] for r in results if r[3]}
              errors = sum(1 for r in results if not r[3])

              # Correctness: deterministic search => every OK response must agree.
              if len(founds) > 1 or len(searcheds) > 1:
                  errors += 1
                  print(f"  MISMATCH: found={founds} searched={searcheds}", file=sys.stderr)

              found = min(founds) if founds else -1
              searched = min(searcheds) if searcheds else -1
              throughput = (args.requests / wall) if wall > 0 else 0.0
              mean_ms = (sum(latencies) / len(latencies) * 1000) if latencies else 0.0
              p50_ms = percentile(latencies, 50) * 1000
              p95_ms = percentile(latencies, 95) * 1000
              peak = read_vmhwm_kb(args.pid)

              print(
                  f"L={args.length} requests={args.requests} concurrency={args.concurrency} "
                  f"threads={args.threads}: throughput={throughput:.1f} req/s "
                  f"mean={mean_ms:.1f}ms p50={p50_ms:.1f}ms p95={p95_ms:.1f}ms "
                  f"peak_rss={peak} KB found={found} searched={searched} errors={errors}",
                  file=sys.stderr,
              )

              # Machine-parseable single line on stdout.
              print(
                  f"{args.length}:{args.requests}:{args.concurrency}:{throughput:.1f}:"
                  f"{mean_ms:.1f}:{p50_ms:.1f}:{p95_ms:.1f}:{peak}:{found}:{searched}:{errors}"
              )


          if __name__ == "__main__":
              main()
          PYEOF
          chmod +x bench_server.py

      - name: Run server multi-solve benchmarks
        run: |
          echo "## 📊 Server Multi-Solve Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Concurrent \`POST /api/solve\` requests (each \`threads=1\`, so concurrency drives load) against the long-running \`serve\` process. Exercises the HTTP path and cross-request memory stability (issue #20 / mimalloc). Server peak RSS is VmHWM sampled after the run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PORT=3030
          ./target/release/sumzle-solver serve --host 127.0.0.1 --port $PORT >server.log 2>&1 &
          SERVER_PID=$!

          # Wait until the server accepts requests. There is no health endpoint,
          # so probe /api/solve with a trivial length-3 puzzle until it 200s.
          READY=0
          for _ in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "http://127.0.0.1:${PORT}/api/solve?threads=1" \
              -H 'Content-Type: application/json' \
              -d '{"length":3,"rows":[]}' || true)
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            sleep 0.5
          done

          > current-server-bench-results.txt
          > server-benchmark-output.txt
          if [ "$READY" = "1" ]; then
            for len in 4 5 6; do
              echo "Running server multi-solve benchmark: L=$len..."
              python3 bench_server.py \
                --url "http://127.0.0.1:${PORT}" --pid "$SERVER_PID" \
                --length "$len" --requests 40 --concurrency 4 --threads 1 --warmup 5 \
                >> current-server-bench-results.txt 2>> server-benchmark-output.txt || true
            done
          else
            echo "Server did not become ready on port ${PORT}; skipping server benchmarks." | tee -a server-benchmark-output.txt
          fi

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

          # Summary table.
          echo "| Length | Requests | Concurrency | Throughput (req/s) | Mean (ms) | p95 (ms) | Server Peak RSS | Errors |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|-------------|--------------------|-----------|----------|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
          while IFS=: read -r LEN REQ CONC TP MEAN P50 P95 PEAK FOUND SRCH ERRS; do
            if [ "$PEAK" -ge 1048576 ]; then
              RSS_HR="$(awk "BEGIN {printf \"%.2f GB\", $PEAK/1048576}")"
            elif [ "$PEAK" -ge 1024 ]; then
              RSS_HR="$(awk "BEGIN {printf \"%.1f MB\", $PEAK/1024}")"
            else
              RSS_HR="$PEAK KB"
            fi
            echo "| $LEN | $REQ | $CONC | $TP | $MEAN | $P95 | $RSS_HR | $ERRS |" >> $GITHUB_STEP_SUMMARY
          done < current-server-bench-results.txt
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Server Benchmark Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat server-benchmark-output.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "--- server.log (tail) ---" >> $GITHUB_STEP_SUMMARY
          tail -n 20 server.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------------
      #  Baseline (main branch) benchmarks – PR only
      # ---------------------------------------------------------------

      - name: Checkout base ref for baseline
        if: github.event_name == 'pull_request'
        run: |
          git worktree add $RUNNER_TEMP/baseline ${{ github.base_ref }}

      - name: Build baseline release binary
        if: github.event_name == 'pull_request'
        run: |
          cd $RUNNER_TEMP/baseline
          cargo build --release --target-dir $RUNNER_TEMP/baseline-target

      - name: Run CLI benchmarks (baseline)
        if: github.event_name == 'pull_request'
        run: |
          BASELINE_BIN="$RUNNER_TEMP/baseline-target/release/sumzle-solver"

          > baseline-bench-results.txt
          for len in 3 4 5 6 7 8; do
            echo "Running baseline CLI benchmark for length $len..."
            OUTPUT=$($BASELINE_BIN bench -l $len 2>&1 || true)
            echo "$OUTPUT" >> baseline-benchmark-output.txt

            SOL=$(echo "$OUTPUT" | sed -n 's/.*: \([0-9]*\) solutions.*/\1/p')
            SRC=$(echo "$OUTPUT" | sed -n 's/.* \([0-9]\+\) searched.*/\1/p')
            TIME_RAW=$(echo "$OUTPUT" | sed -n 's/.*searched,[[:space:]]*\(.*\)/\1/p')

            if [ -n "$SOL" ]; then
              echo "${len}:${SOL}:${SRC}:${TIME_RAW}" >> baseline-bench-results.txt
            fi
          done

          > baseline-parallel-bench-results.txt
          # Check if baseline binary supports --parallel flag
          if $BASELINE_BIN bench --help 2>&1 | grep -q -- '--parallel'; then
            for len in 3 4 5 6 7 8; do
              echo "Running baseline parallel CLI benchmark for length $len..."
              OUTPUT=$($BASELINE_BIN bench -l $len --parallel 2>&1 || true)
              echo "$OUTPUT" >> baseline-parallel-benchmark-output.txt

              SOL=$(echo "$OUTPUT" | sed -n 's/.*: \([0-9]*\) solutions.*/\1/p')
              SRC=$(echo "$OUTPUT" | sed -n 's/.* \([0-9]\+\) searched.*/\1/p')
              TIME_RAW=$(echo "$OUTPUT" | sed -n 's/.*searched,[[:space:]]*\(.*\)/\1/p')

              if [ -n "$SOL" ]; then
                echo "${len}:${SOL}:${SRC}:${TIME_RAW}" >> baseline-parallel-bench-results.txt
              fi
            done
          else
            echo "Baseline binary does not support --parallel, skipping baseline parallel benchmarks."
          fi

      - name: Run Top-N benchmarks (baseline)
        if: github.event_name == 'pull_request'
        run: |
          BASELINE_BIN="$RUNNER_TEMP/baseline-target/release/sumzle-solver"
          > baseline-topn-bench-results.txt
          > baseline-topn-benchmark-output.txt
          # Skip if baseline binary doesn't support --top (pre-PR9 main)
          if $BASELINE_BIN solve --help 2>&1 | grep -q -- '--top'; then
            for len in 6 7 8 9; do
              for n in 100 1000; do
                echo "Running baseline top-N: L=$len N=$n..."
                OUTPUT=$($BASELINE_BIN solve -i puzzle-len${len}.json -t 0 --top $n -f text 2>&1 || true)
                echo "$OUTPUT" >> baseline-topn-benchmark-output.txt

                SOL=$(echo "$OUTPUT" | sed -n 's/^Solutions found: \([0-9]*\).*/\1/p')
                SRC=$(echo "$OUTPUT" | sed -n 's/^Expressions searched: \([0-9]*\).*/\1/p')
                TIME_MS=$(echo "$OUTPUT" | sed -n 's/^Time: \([0-9]*\)ms.*/\1/p')
                SPEED=$(echo "$OUTPUT" | sed -n 's/^Speed: \([0-9]*\) expr\/s.*/\1/p')
                if [ -n "$SOL" ]; then
                  echo "${len}:${n}:${SOL}:${SRC}:${TIME_MS}:${SPEED}" >> baseline-topn-bench-results.txt
                fi
              done
            done
          else
            echo "Baseline binary does not support --top, skipping baseline top-N benchmarks." >> baseline-topn-benchmark-output.txt
          fi

      - name: Run Streaming benchmarks (baseline)
        if: github.event_name == 'pull_request'
        run: |
          BASELINE_BIN="$RUNNER_TEMP/baseline-target/release/sumzle-solver"
          > baseline-stream-bench-results.txt
          > baseline-stream-benchmark-output.txt
          if $BASELINE_BIN solve --help 2>&1 | grep -q -- '--output'; then
            for len in 6 7 8 9; do
              echo "Running baseline streaming: L=$len..."
              OUTPUT=$($BASELINE_BIN solve -i puzzle-len${len}.json -t 0 --output "baseline-stream-len${len}.jsonl" 2>&1 || true)
              echo "$OUTPUT" >> baseline-stream-benchmark-output.txt

              SOL=$(echo "$OUTPUT" | sed -n 's/^Solutions found: \([0-9]*\).*/\1/p')
              SRC=$(echo "$OUTPUT" | sed -n 's/^Expressions searched: \([0-9]*\).*/\1/p')
              TIME_MS=$(echo "$OUTPUT" | sed -n 's/^Time: \([0-9]*\)ms.*/\1/p')
              SPEED=$(echo "$OUTPUT" | sed -n 's/^Speed: \([0-9]*\) expr\/s.*/\1/p')
              FILE_BYTES=$(stat -c %s "baseline-stream-len${len}.jsonl" 2>/dev/null || echo 0)
              if [ -n "$SOL" ]; then
                echo "${len}:${SOL}:${SRC}:${TIME_MS}:${SPEED}:${FILE_BYTES}" >> baseline-stream-bench-results.txt
              fi
            done
          else
            echo "Baseline binary does not support --output, skipping baseline streaming benchmarks." >> baseline-stream-benchmark-output.txt
          fi

      - name: Run memory benchmarks (baseline)
        if: github.event_name == 'pull_request'
        run: |
          BASELINE_BIN="$RUNNER_TEMP/baseline-target/release/sumzle-solver"
          > baseline-mem-bench-results.txt
          > baseline-mem-benchmark-output.txt
          if $BASELINE_BIN solve --help 2>&1 | grep -q -- '--top' && \
             $BASELINE_BIN solve --help 2>&1 | grep -q -- '--output'; then
            for len in 6 7 8; do
              for mode in default streaming top; do
                echo "Running baseline memory: L=$len mode=$mode..."
                if [ "$mode" = "default" ]; then
                  OUTPUT=$(python3 measure_rss.py --quiet $BASELINE_BIN solve -i puzzle-len${len}.json -t 0 -f text 2>&1 || true)
                elif [ "$mode" = "streaming" ]; then
                  OUTPUT=$(python3 measure_rss.py --quiet $BASELINE_BIN solve -i puzzle-len${len}.json -t 0 --output "baseline-mem-stream-len${len}.jsonl" 2>&1 || true)
                else
                  OUTPUT=$(python3 measure_rss.py --quiet $BASELINE_BIN solve -i puzzle-len${len}.json -t 0 --top 100 -f text 2>&1 || true)
                fi
                echo "$OUTPUT" >> baseline-mem-benchmark-output.txt

                PEAK=$(echo "$OUTPUT" | sed -n 's/^PEAK_RSS_KB=\([0-9]*\).*/\1/p')
                WALL=$(echo "$OUTPUT" | sed -n 's/.*WALL_MS=\([0-9]*\).*/\1/p')
                if [ -n "$PEAK" ]; then
                  echo "${len}:${mode}:${PEAK}:${WALL}" >> baseline-mem-bench-results.txt
                fi
              done
            done
          else
            echo "Baseline binary does not support --top/--output, skipping baseline memory benchmarks." >> baseline-mem-benchmark-output.txt
          fi

      - name: Run server multi-solve benchmarks (baseline)
        if: github.event_name == 'pull_request'
        run: |
          BASELINE_BIN="$RUNNER_TEMP/baseline-target/release/sumzle-solver"
          PORT=3030
          "$BASELINE_BIN" serve --host 127.0.0.1 --port $PORT >baseline-server.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "http://127.0.0.1:${PORT}/api/solve?threads=1" \
              -H 'Content-Type: application/json' \
              -d '{"length":3,"rows":[]}' || true)
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            sleep 0.5
          done

          > baseline-server-bench-results.txt
          > baseline-server-benchmark-output.txt
          if [ "$READY" = "1" ]; then
            for len in 4 5 6; do
              echo "Running baseline server multi-solve benchmark: L=$len..."
              python3 bench_server.py \
                --url "http://127.0.0.1:${PORT}" --pid "$SERVER_PID" \
                --length "$len" --requests 40 --concurrency 4 --threads 1 --warmup 5 \
                >> baseline-server-bench-results.txt 2>> baseline-server-benchmark-output.txt || true
            done
          else
            echo "Baseline server did not become ready; skipping baseline server benchmarks." | tee -a baseline-server-benchmark-output.txt
          fi

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

      # ---------------------------------------------------------------
      #  Benchmark comparison (PR only)
      # ---------------------------------------------------------------

      - name: Compare benchmark results with main branch
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          python3 << 'PYEOF'
          import re, os

          def parse_time_ns(time_str):
              """Convert a time string like 275us, 2.2ms, 367ms to nanoseconds."""
              if not time_str or time_str.strip() == "":
                  return None
              time_str = time_str.strip()
              # Handle micro sign (µ) and ASCII 'us'
              m = re.match(r"^([0-9.]+)\s*(ns|µs|us|ms|s)$", time_str)
              if not m:
                  return None
              value = float(m.group(1))
              unit = m.group(2)
              multipliers = {"ns": 1, "µs": 1e3, "us": 1e3, "ms": 1e6, "s": 1e9}
              return value * multipliers.get(unit, 1)

          def format_time(ns):
              """Format nanoseconds to a human-readable string."""
              if ns is None:
                  return "N/A"
              if ns < 1e3:
                  return f"{ns:.0f}ns"
              elif ns < 1e6:
                  return f"{ns/1e3:.1f}us"
              elif ns < 1e9:
                  return f"{ns/1e6:.1f}ms"
              else:
                  return f"{ns/1e9:.2f}s"

          def format_diff_pct(current_ns, baseline_ns):
              """Format percentage difference with emoji indicator."""
              if current_ns is None or baseline_ns is None or baseline_ns == 0:
                  return "N/A", "⚪"
              pct = ((current_ns - baseline_ns) / baseline_ns) * 100
              if pct > 10:
                  emoji = "🔴"
              elif pct > 5:
                  emoji = "🟡"
              elif pct < -10:
                  emoji = "🟢"
              elif pct < -5:
                  emoji = "🔵"
              else:
                  emoji = "⚪"
              sign = "+" if pct >= 0 else ""
              return f"{sign}{pct:.1f}%", emoji

          def load_results(filepath):
              """Load benchmark results from colon-separated file."""
              results = {}
              try:
                  with open(filepath) as f:
                      for line in f:
                          parts = line.strip().split(":", 3)
                          if len(parts) == 4:
                              length = parts[0]
                              results[length] = {
                                  "solutions": int(parts[1]),
                                  "searched": int(parts[2]),
                                  "time_raw": parts[3],
                                  "time_ns": parse_time_ns(parts[3]),
                              }
              except FileNotFoundError:
                  pass
              return results

          def load_topn_results(filepath):
              """Load top-N results: L:N:sol:searched:time_ms:speed."""
              results = {}
              try:
                  with open(filepath) as f:
                      for line in f:
                          parts = line.strip().split(":")
                          if len(parts) == 6:
                              key = f"{parts[0]}:{parts[1]}"
                              results[key] = {
                                  "length": parts[0],
                                  "n": int(parts[1]),
                                  "solutions": int(parts[2]),
                                  "searched": int(parts[3]),
                                  "time_ms": int(parts[4]),
                                  "speed": int(parts[5]),
                                  "time_ns": int(parts[4]) * 1_000_000,
                              }
              except FileNotFoundError:
                  pass
              return results

          def load_stream_results(filepath):
              """Load streaming results: L:sol:searched:time_ms:speed:file_bytes."""
              results = {}
              try:
                  with open(filepath) as f:
                      for line in f:
                          parts = line.strip().split(":")
                          if len(parts) == 6:
                              results[parts[0]] = {
                                  "solutions": int(parts[1]),
                                  "searched": int(parts[2]),
                                  "time_ms": int(parts[3]),
                                  "speed": int(parts[4]),
                                  "file_bytes": int(parts[5]),
                                  "time_ns": int(parts[3]) * 1_000_000,
                              }
              except FileNotFoundError:
                  pass
              return results

          def load_mem_results(filepath):
              """Load memory results: L:mode:peak_rss_kb:wall_ms."""
              results = {}
              try:
                  with open(filepath) as f:
                      for line in f:
                          parts = line.strip().split(":")
                          if len(parts) == 4:
                              key = f"{parts[0]}:{parts[1]}"
                              results[key] = {
                                  "length": parts[0],
                                  "mode": parts[1],
                                  "peak_rss_kb": int(parts[2]),
                                  "wall_ms": int(parts[3]),
                              }
              except FileNotFoundError:
                  pass
              return results

          def load_server_results(filepath):
              """Load server results: L:req:conc:throughput:mean_ms:p50_ms:p95_ms:peak_rss_kb:found:searched:errors."""
              results = {}
              try:
                  with open(filepath) as f:
                      for line in f:
                          parts = line.strip().split(":")
                          if len(parts) == 11:
                              results[parts[0]] = {
                                  "requests": int(parts[1]),
                                  "concurrency": int(parts[2]),
                                  "throughput": float(parts[3]),
                                  "mean_ms": float(parts[4]),
                                  "p50_ms": float(parts[5]),
                                  "p95_ms": float(parts[6]),
                                  "peak_rss_kb": int(parts[7]),
                                  "found": int(parts[8]),
                                  "searched": int(parts[9]),
                                  "errors": int(parts[10]),
                                  # Mean latency in ns, so format_diff_pct (lower = better)
                                  # treats a latency regression like the other time metrics.
                                  "time_ns": float(parts[4]) * 1_000_000,
                              }
              except FileNotFoundError:
                  pass
              return results

          def format_rss(kb):
              if kb is None:
                  return "N/A"
              if kb >= 1024 * 1024:
                  return f"{kb / (1024 * 1024):.2f} GB"
              elif kb >= 1024:
                  return f"{kb / 1024:.1f} MB"
              else:
                  return f"{kb} KB"

          current = load_results("current-bench-results.txt")
          current_par = load_results("current-parallel-bench-results.txt")
          baseline = load_results("baseline-bench-results.txt")
          baseline_par = load_results("baseline-parallel-bench-results.txt")
          current_topn = load_topn_results("current-topn-bench-results.txt")
          baseline_topn = load_topn_results("baseline-topn-bench-results.txt")
          current_stream = load_stream_results("current-stream-bench-results.txt")
          baseline_stream = load_stream_results("baseline-stream-bench-results.txt")
          current_mem = load_mem_results("current-mem-bench-results.txt")
          baseline_mem = load_mem_results("baseline-mem-bench-results.txt")
          current_server = load_server_results("current-server-bench-results.txt")
          baseline_server = load_server_results("baseline-server-bench-results.txt")

          pr_branch = os.environ.get("PR_BRANCH", "PR")
          base_branch = os.environ.get("BASE_BRANCH", "main")

          has_mismatch = False
          has_regression = False

          lines = []

          # =============================================================
          #  Section 1: Sequential Performance Comparison
          # =============================================================
          lines.append("## 📊 Sequential Benchmark Comparison with Main Branch")
          lines.append("")
          lines.append(f"Comparing **{pr_branch}** (PR) vs **{base_branch}** (baseline)")
          lines.append("")
          lines.append("| Length | Metric | PR | Main | Match | Diff |")
          lines.append("|--------|--------|-----|------|-------|------|")

          for length in ["3", "4", "5", "6", "7", "8"]:
              cur = current.get(length)
              base = baseline.get(length)

              if not cur or not base:
                  lines.append(f"| {length} | — | — | — | ⚠️ Missing | — |")
                  continue

              # Solutions comparison
              sol_match = cur["solutions"] == base["solutions"]
              sol_icon = "✅" if sol_match else "❌"
              if not sol_match:
                  has_mismatch = True
                  sol_diff = f'{cur["solutions"] - base["solutions"]:+d}'
              else:
                  sol_diff = "="
              lines.append(f'| {length} | Solutions | {cur["solutions"]} | {base["solutions"]} | {sol_icon} | {sol_diff} |')

              # Expressions Searched comparison
              src_match = cur["searched"] == base["searched"]
              src_icon = "✅" if src_match else "❌"
              if not src_match:
                  has_mismatch = True
                  src_diff = f'{cur["searched"] - base["searched"]:+d}'
              else:
                  src_diff = "="
              lines.append(f'| {length} | Expr Searched | {cur["searched"]} | {base["searched"]} | {src_icon} | {src_diff} |')

              # Time comparison
              time_diff_pct, time_emoji = format_diff_pct(cur["time_ns"], base["time_ns"])
              if time_emoji in ("🔴", "🟡"):
                  has_regression = True
              cur_time_str = format_time(cur["time_ns"]) if cur["time_ns"] is not None else cur["time_raw"]
              base_time_str = format_time(base["time_ns"]) if base["time_ns"] is not None else base["time_raw"]
              lines.append(f"| {length} | Time | {cur_time_str} | {base_time_str} | {time_emoji} | {time_diff_pct} |")

          lines.append("")

          # =============================================================
          #  Section 2: Parallel Performance Comparison
          # =============================================================
          if baseline_par:
              lines.append("## 📊 Parallel Benchmark Comparison with Main Branch")
              lines.append("")
              lines.append(f"Comparing **{pr_branch}** (PR) vs **{base_branch}** (baseline)")
              lines.append("")
              lines.append("| Length | Metric | PR | Main | Match | Diff |")
              lines.append("|--------|--------|-----|------|-------|------|")

              for length in ["3", "4", "5", "6", "7", "8"]:
                  cur = current_par.get(length)
                  base = baseline_par.get(length)

                  if not cur or not base:
                      lines.append(f"| {length} | — | — | — | ⚠️ Missing | — |")
                      continue

                  sol_match = cur["solutions"] == base["solutions"]
                  sol_icon = "✅" if sol_match else "❌"
                  if not sol_match:
                      has_mismatch = True
                      sol_diff = f'{cur["solutions"] - base["solutions"]:+d}'
                  else:
                      sol_diff = "="
                  lines.append(f'| {length} | Solutions | {cur["solutions"]} | {base["solutions"]} | {sol_icon} | {sol_diff} |')

                  src_match = cur["searched"] == base["searched"]
                  src_icon = "✅" if src_match else "❌"
                  if not src_match:
                      has_mismatch = True
                      src_diff = f'{cur["searched"] - base["searched"]:+d}'
                  else:
                      src_diff = "="
                  lines.append(f'| {length} | Expr Searched | {cur["searched"]} | {base["searched"]} | {src_icon} | {src_diff} |')

                  time_diff_pct, time_emoji = format_diff_pct(cur["time_ns"], base["time_ns"])
                  if time_emoji in ("🔴", "🟡"):
                      has_regression = True
                  cur_time_str = format_time(cur["time_ns"]) if cur["time_ns"] is not None else cur["time_raw"]
                  base_time_str = format_time(base["time_ns"]) if base["time_ns"] is not None else base["time_raw"]
                  lines.append(f"| {length} | Time | {cur_time_str} | {base_time_str} | {time_emoji} | {time_diff_pct} |")

              lines.append("")

          # =============================================================
          #  Section 3: Sequential vs Parallel Consistency Check
          # =============================================================
          if current_par:
              lines.append("## ✅ Sequential vs Parallel Consistency Check")
              lines.append("")
              lines.append("Verifying that the parallel solver produces identical results to the sequential solver (auto thread count).")
              lines.append("")
              lines.append("| Length | Metric | Sequential | Parallel | Match |")
              lines.append("|--------|--------|------------|----------|-------|")

              for length in ["3", "4", "5", "6", "7", "8"]:
                  seq = current.get(length)
                  par = current_par.get(length)

                  if not seq or not par:
                      lines.append(f"| {length} | — | — | — | ⚠️ Missing |")
                      continue

                  sol_match = seq["solutions"] == par["solutions"]
                  sol_icon = "✅" if sol_match else "❌"
                  if not sol_match:
                      has_mismatch = True
                  lines.append(f'| {length} | Solutions | {seq["solutions"]} | {par["solutions"]} | {sol_icon} |')

                  src_match = seq["searched"] == par["searched"]
                  src_icon = "✅" if src_match else "❌"
                  if not src_match:
                      has_mismatch = True
                  lines.append(f'| {length} | Expr Searched | {seq["searched"]} | {par["searched"]} | {src_icon} |')

                  # Speedup comparison
                  if seq["time_ns"] and par["time_ns"] and par["time_ns"] > 0:
                      speedup = seq["time_ns"] / par["time_ns"]
                      speedup_str = f"{speedup:.2f}x"
                  else:
                      speedup_str = "N/A"
                  lines.append(f'| {length} | Time | {format_time(seq["time_ns"]) if seq["time_ns"] else seq["time_raw"]} | {format_time(par["time_ns"]) if par["time_ns"] else par["time_raw"]} | ⚡ {speedup_str} |')

              lines.append("")

          # =============================================================
          #  Section 4: Top-N Benchmark Comparison
          # =============================================================
          if current_topn:
              lines.append("## 📊 Top-N Benchmark Comparison with Main Branch")
              lines.append("")
              lines.append(f"Comparing **{pr_branch}** (PR) vs **{base_branch}** (baseline)")
              lines.append("")
              lines.append("| Length | N | Metric | PR | Main | Match | Diff |")
              lines.append("|--------|------|--------|-----|------|-------|------|")
              for length in ["6", "7", "8", "9"]:
                  for n in [100, 1000]:
                      key = f"{length}:{n}"
                      cur = current_topn.get(key)
                      base = baseline_topn.get(key)
                      if not cur:
                          lines.append(f"| {length} | {n} | — | — | — | ⚠️ Missing | — |")
                          continue
                      # Solutions kept should equal N (sanity)
                      sol_match = cur["solutions"] == n
                      sol_icon = "✅" if sol_match else "❌"
                      sol_diff = "=" if sol_match else f'{cur["solutions"] - n:+d}'
                      # searched should match baseline
                      if base:
                          src_match = cur["searched"] == base["searched"]
                          src_icon = "✅" if src_match else "❌"
                          if not src_match:
                              has_mismatch = True
                              src_diff = f'{cur["searched"] - base["searched"]:+d}'
                          else:
                              src_diff = "="
                          time_diff_pct, time_emoji = format_diff_pct(cur["time_ns"], base["time_ns"])
                          if time_emoji in ("🔴", "🟡"):
                              has_regression = True
                          cur_time_str = format_time(cur["time_ns"])
                          base_time_str = format_time(base["time_ns"])
                          base_src_str = str(base["searched"])
                          base_sol_str = str(base["solutions"])
                      else:
                          src_icon = "—"; src_diff = "—"
                          time_emoji = "—"; time_diff_pct = "—"
                          cur_time_str = format_time(cur["time_ns"])
                          base_time_str = "N/A"
                          base_src_str = "—"
                          base_sol_str = "—"
                      lines.append(f'| {length} | {n} | Solutions (kept) | {cur["solutions"]} | {base_sol_str} | {sol_icon} | {sol_diff} |')
                      lines.append(f'| {length} | {n} | Expr Searched | {cur["searched"]} | {base_src_str} | {src_icon} | {src_diff} |')
                      lines.append(f"| {length} | {n} | Time | {cur_time_str} | {base_time_str} | {time_emoji} | {time_diff_pct} |")
              lines.append("")

          # =============================================================
          #  Section 5: Streaming Benchmark Comparison
          # =============================================================
          if current_stream:
              lines.append("## 📊 Streaming Benchmark Comparison with Main Branch")
              lines.append("")
              lines.append(f"Comparing **{pr_branch}** (PR) vs **{base_branch}** (baseline)")
              lines.append("")
              lines.append("| Length | Metric | PR | Main | Match | Diff |")
              lines.append("|--------|--------|-----|------|-------|------|")
              for length in ["6", "7", "8", "9"]:
                  cur = current_stream.get(length)
                  base = baseline_stream.get(length)
                  if not cur:
                      lines.append(f"| {length} | — | — | — | ⚠️ Missing | — |")
                      continue
                  if base:
                      sol_match = cur["solutions"] == base["solutions"]
                      sol_icon = "✅" if sol_match else "❌"
                      if not sol_match:
                          has_mismatch = True
                          sol_diff = f'{cur["solutions"] - base["solutions"]:+d}'
                      else:
                          sol_diff = "="
                      src_match = cur["searched"] == base["searched"]
                      src_icon = "✅" if src_match else "❌"
                      if not src_match:
                          has_mismatch = True
                          src_diff = f'{cur["searched"] - base["searched"]:+d}'
                      else:
                          src_diff = "="
                      time_diff_pct, time_emoji = format_diff_pct(cur["time_ns"], base["time_ns"])
                      if time_emoji in ("🔴", "🟡"):
                          has_regression = True
                      cur_time_str = format_time(cur["time_ns"])
                      base_time_str = format_time(base["time_ns"])
                      base_sol_str = str(base["solutions"])
                      base_src_str = str(base["searched"])
                  else:
                      sol_icon = "—"; sol_diff = "—"
                      src_icon = "—"; src_diff = "—"
                      time_emoji = "—"; time_diff_pct = "—"
                      cur_time_str = format_time(cur["time_ns"])
                      base_time_str = "N/A"
                      base_sol_str = "—"
                      base_src_str = "—"
                  lines.append(f'| {length} | Solutions | {cur["solutions"]} | {base_sol_str} | {sol_icon} | {sol_diff} |')
                  lines.append(f'| {length} | Expr Searched | {cur["searched"]} | {base_src_str} | {src_icon} | {src_diff} |')
                  lines.append(f"| {length} | Time | {cur_time_str} | {base_time_str} | {time_emoji} | {time_diff_pct} |")
              lines.append("")

          # =============================================================
          #  Section 6: Memory Benchmark Comparison
          # =============================================================
          if current_mem:
              lines.append("## 📊 Memory Benchmark Comparison with Main Branch")
              lines.append("")
              lines.append("Peak resident set size (VmHWM) per (length, mode). Larger RSS than main is a memory regression.")
              lines.append("")
              lines.append("| Length | Mode | PR RSS | Main RSS | Match | Diff |")
              lines.append("|--------|------|--------|----------|-------|------|")
              for length in ["6", "7", "8"]:
                  for mode in ["default", "streaming", "top"]:
                      key = f"{length}:{mode}"
                      cur = current_mem.get(key)
                      base = baseline_mem.get(key)
                      if not cur:
                          lines.append(f"| {length} | {mode} | — | — | ⚠️ Missing | — |")
                          continue
                      if base and base["peak_rss_kb"] > 0:
                          rss_diff_pct = ((cur["peak_rss_kb"] - base["peak_rss_kb"]) / base["peak_rss_kb"]) * 100
                          if rss_diff_pct > 10:
                              rss_icon = "🔴"
                              has_regression = True
                          elif rss_diff_pct > 5:
                              rss_icon = "🟡"
                              has_regression = True
                          elif rss_diff_pct < -10:
                              rss_icon = "🟢"
                          elif rss_diff_pct < -5:
                              rss_icon = "🔵"
                          else:
                              rss_icon = "⚪"
                          sign = "+" if rss_diff_pct >= 0 else ""
                          rss_diff_str = f"{sign}{rss_diff_pct:.1f}%"
                          base_rss_hr = format_rss(base["peak_rss_kb"])
                      else:
                          rss_icon = "—"
                          rss_diff_str = "—"
                          base_rss_hr = "N/A"
                      cur_rss_hr = format_rss(cur["peak_rss_kb"])
                      lines.append(f'| {length} | {mode} | {cur_rss_hr} | {base_rss_hr} | {rss_icon} | {rss_diff_str} |')
              lines.append("")

          # =============================================================
          #  Section 6b: Server Multi-Solve Benchmark Comparison
          # =============================================================
          if current_server:
              lines.append("## 📊 Server Multi-Solve Benchmark Comparison with Main Branch")
              lines.append("")
              lines.append(f"Comparing **{pr_branch}** (PR) vs **{base_branch}** (baseline). Concurrent `POST /api/solve`; lower mean latency / higher throughput is better, and server peak RSS larger than main is a memory regression (issue #20).")
              lines.append("")
              lines.append("| Length | Metric | PR | Main | Match | Diff |")
              lines.append("|--------|--------|-----|------|-------|------|")
              for length in ["4", "5", "6"]:
                  cur = current_server.get(length)
                  base = baseline_server.get(length)
                  if not cur:
                      lines.append(f"| {length} | — | — | — | ⚠️ Missing | — |")
                      continue

                  # Failed requests / intra-run found|searched disagreement.
                  err_icon = "✅" if cur["errors"] == 0 else "❌"
                  if cur["errors"] != 0:
                      has_mismatch = True
                  base_err = str(base["errors"]) if base else "—"
                  lines.append(f'| {length} | Errors | {cur["errors"]} | {base_err} | {err_icon} | — |')

                  if base:
                      # Correctness: found/searched must match the baseline server.
                      sol_match = cur["found"] == base["found"]
                      sol_icon = "✅" if sol_match else "❌"
                      if not sol_match:
                          has_mismatch = True
                      sol_diff = "=" if sol_match else f'{cur["found"] - base["found"]:+d}'
                      lines.append(f'| {length} | Solutions | {cur["found"]} | {base["found"]} | {sol_icon} | {sol_diff} |')

                      src_match = cur["searched"] == base["searched"]
                      src_icon = "✅" if src_match else "❌"
                      if not src_match:
                          has_mismatch = True
                      src_diff = "=" if src_match else f'{cur["searched"] - base["searched"]:+d}'
                      lines.append(f'| {length} | Expr Searched | {cur["searched"]} | {base["searched"]} | {src_icon} | {src_diff} |')

                      # Throughput (higher is better) — informational ratio.
                      if base["throughput"] > 0:
                          tp_ratio = f'{cur["throughput"] / base["throughput"]:.2f}x'
                      else:
                          tp_ratio = "N/A"
                      lines.append(f'| {length} | Throughput | {cur["throughput"]:.1f} req/s | {base["throughput"]:.1f} req/s | ⚡ | {tp_ratio} |')

                      # Mean latency (lower is better) drives the regression gate.
                      lat_diff_pct, lat_emoji = format_diff_pct(cur["time_ns"], base["time_ns"])
                      if lat_emoji in ("🔴", "🟡"):
                          has_regression = True
                      lines.append(f'| {length} | Mean Latency | {cur["mean_ms"]:.1f}ms | {base["mean_ms"]:.1f}ms | {lat_emoji} | {lat_diff_pct} |')

                      # Server peak RSS (lower is better) — issue #20 guard.
                      if base["peak_rss_kb"] > 0:
                          rss_diff_pct = ((cur["peak_rss_kb"] - base["peak_rss_kb"]) / base["peak_rss_kb"]) * 100
                          if rss_diff_pct > 10:
                              rss_icon = "🔴"; has_regression = True
                          elif rss_diff_pct > 5:
                              rss_icon = "🟡"; has_regression = True
                          elif rss_diff_pct < -10:
                              rss_icon = "🟢"
                          elif rss_diff_pct < -5:
                              rss_icon = "🔵"
                          else:
                              rss_icon = "⚪"
                          sign = "+" if rss_diff_pct >= 0 else ""
                          rss_diff_str = f"{sign}{rss_diff_pct:.1f}%"
                          base_rss_hr = format_rss(base["peak_rss_kb"])
                      else:
                          rss_icon = "—"; rss_diff_str = "—"; base_rss_hr = "N/A"
                      lines.append(f'| {length} | Server Peak RSS | {format_rss(cur["peak_rss_kb"])} | {base_rss_hr} | {rss_icon} | {rss_diff_str} |')
                  else:
                      lines.append(f'| {length} | Throughput | {cur["throughput"]:.1f} req/s | N/A | — | — |')
                      lines.append(f'| {length} | Mean Latency | {cur["mean_ms"]:.1f}ms | N/A | — | — |')
                      lines.append(f'| {length} | Server Peak RSS | {format_rss(cur["peak_rss_kb"])} | N/A | — | — |')
              lines.append("")

          # =============================================================
          #  Section 7: Cross-Mode searched_count Consistency Check
          # =============================================================
          if current_stream or current_topn:
              lines.append("## ✅ Cross-Mode searched_count Consistency Check")
              lines.append("")
              lines.append("Verifies that default, streaming, and top-N modes all enumerate the same expression space (searched_count must match across modes).")
              lines.append("")
              lines.append("| Length | Default (parallel) | Streaming | Top-N (N=100) | Top-N (N=1000) | Match |")
              lines.append("|--------|---------------------|-----------|---------------|-----------------|-------|")
              for length in ["6", "7", "8", "9"]:
                  # Default searched_count comes from parallel bench (covers L3-L8; no L9).
                  default_src = current_par.get(length, {}).get("searched") if length != "9" else None
                  stream_src = current_stream.get(length, {}).get("searched")
                  topn100_src = current_topn.get(f"{length}:100", {}).get("searched")
                  topn1000_src = current_topn.get(f"{length}:1000", {}).get("searched")
                  vals = [v for v in [default_src, stream_src, topn100_src, topn1000_src] if v is not None]
                  all_match = len(set(vals)) <= 1
                  match_icon = "✅" if all_match else "❌"
                  if not all_match:
                      has_mismatch = True
                  def fmt_src(v):
                      return str(v) if v is not None else "—"
                  lines.append(f"| {length} | {fmt_src(default_src)} | {fmt_src(stream_src)} | {fmt_src(topn100_src)} | {fmt_src(topn1000_src)} | {match_icon} |")
              lines.append("")

          # Add legend
          lines.append("<details>")
          lines.append("<summary>📖 Comparison Legend</summary>")
          lines.append("")
          lines.append("| Icon | Meaning |")
          lines.append("|------|---------|")
          lines.append("| ✅ | Values match (correctness OK) |")
          lines.append("| ❌ | Values differ (correctness concern) |")
          lines.append("| 🟢 | Time improved > 10% |")
          lines.append("| 🔵 | Time improved 5-10% |")
          lines.append("| ⚪ | Time within ±5% (noise range) |")
          lines.append("| 🟡 | Time regressed 5-10% |")
          lines.append("| 🔴 | Time regressed > 10% |")
          lines.append("| ⚡ | Parallel speedup vs sequential |")
          lines.append("")
          lines.append("</details>")
          lines.append("")

          # Add warnings / all-clear
          if has_mismatch:
              lines.append("> ⚠️ **Solutions or Expressions Searched count mismatch detected!** This may indicate a correctness issue.")
              lines.append("")
          if has_regression:
              lines.append("> 🔴 **Performance regression detected!** One or more benchmarks show > 5% slowdown compared to main.")
              lines.append("")
          if not has_mismatch and not has_regression:
              lines.append("> ✅ **No correctness or significant performance issues detected.**")
              lines.append("")

          # Add raw baseline output in collapsible section
          lines.append("<details>")
          lines.append("<summary>📝 Raw Baseline (Main Branch) Benchmark Output</summary>")
          lines.append("")
          lines.append("```")
          try:
              with open("baseline-benchmark-output.txt") as f:
                  lines.append(f.read())
          except FileNotFoundError:
              lines.append("(no baseline output)")
          lines.append("```")
          lines.append("")
          lines.append("</details>")

          lines.append("<details>")
          lines.append("<summary>📝 Raw Baseline Parallel Benchmark Output</summary>")
          lines.append("")
          lines.append("```")
          try:
              with open("baseline-parallel-benchmark-output.txt") as f:
                  lines.append(f.read())
          except FileNotFoundError:
              lines.append("(no baseline parallel output)")
          lines.append("```")
          lines.append("")
          lines.append("</details>")

          lines.append("<details>")
          lines.append("<summary>📝 Raw Baseline Top-N Benchmark Output</summary>")
          lines.append("")
          lines.append("```")
          try:
              with open("baseline-topn-benchmark-output.txt") as f:
                  lines.append(f.read())
          except FileNotFoundError:
              lines.append("(no baseline top-N output)")
          lines.append("```")
          lines.append("")
          lines.append("</details>")

          lines.append("<details>")
          lines.append("<summary>📝 Raw Baseline Streaming Benchmark Output</summary>")
          lines.append("")
          lines.append("```")
          try:
              with open("baseline-stream-benchmark-output.txt") as f:
                  lines.append(f.read())
          except FileNotFoundError:
              lines.append("(no baseline streaming output)")
          lines.append("```")
          lines.append("")
          lines.append("</details>")

          lines.append("<details>")
          lines.append("<summary>📝 Raw Baseline Memory Benchmark Output</summary>")
          lines.append("")
          lines.append("```")
          try:
              with open("baseline-mem-benchmark-output.txt") as f:
                  lines.append(f.read())
          except FileNotFoundError:
              lines.append("(no baseline memory output)")
          lines.append("```")
          lines.append("")
          lines.append("</details>")

          lines.append("<details>")
          lines.append("<summary>📝 Raw Baseline Server Benchmark Output</summary>")
          lines.append("")
          lines.append("```")
          try:
              with open("baseline-server-benchmark-output.txt") as f:
                  lines.append(f.read())
          except FileNotFoundError:
              lines.append("(no baseline server output)")
          lines.append("```")
          lines.append("")
          lines.append("</details>")

          # Write to step summary
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")

          # Print summary for the log
          if has_mismatch:
              print("WARNING: Solutions or Expressions Searched mismatch detected!")
          if has_regression:
              print("WARNING: Performance regression detected!")
          if not has_mismatch and not has_regression:
              print("All benchmark comparisons passed.")
          PYEOF

      # ---------------------------------------------------------------
      #  Criterion micro-benchmarks (all events)
      # ---------------------------------------------------------------

      - name: Run Criterion benchmarks
        run: |
          echo "## 📈 Criterion Micro-Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run all criterion benchmarks with minimal sample count for CI speed.
          # Use --bench benchmark to only run the Criterion benchmark target,
          # avoiding the lib unit-test harness which doesn't understand --quick.
          cargo bench --bench benchmark -- --quick 2>&1 | tee criterion-output.txt || true

          # Parse criterion output and build summary table
          echo "| Benchmark Group | Benchmark | Mean Time |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|-----------|-----------|" >> $GITHUB_STEP_SUMMARY

          # Extract benchmark results from criterion output
          grep -E '^\S+.*time:\s+\[' criterion-output.txt | while IFS= read -r LINE; do
            BENCH_NAME=$(echo "$LINE" | sed -E 's/\s+time:.*//')
            MEAN_TIME=$(echo "$LINE" | sed -E 's/.*time:\s+\[\s*([^]]+)\].*/\1/' | awk '{print $1, $2}')
            GROUP=$(echo "$BENCH_NAME" | cut -d'/' -f1)
            BENCH=$(echo "$BENCH_NAME" | cut -d'/' -f2-)
            echo "| $GROUP | $BENCH | $MEAN_TIME |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY

          # Add raw output in collapsible section
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📝 Raw Criterion Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat criterion-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Finalize benchmark summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ Benchmarks run on GitHub Actions \`ubuntu-latest\` runner. Results may vary due to shared hardware." >> $GITHUB_STEP_SUMMARY

  # Release builds only run on push (not PRs).
  # Each target produces a single combined archive containing the backend
  # binary AND the pre-built frontend (frontend/dist), so end users can
  # download one file and run the full app — no separate frontend build
  # or reverse proxy required. The server's get_frontend_dir() resolution
  # looks for <exe_dir>/frontend/dist automatically, so unpacking the
  # archive and running the binary "just works".
  build-release:
    name: Build Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [test, check]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sumzle-solver
            asset_name: sumzle-solver-linux-x86_64
            archive_ext: tar.gz
            archive_cmd: tar -czf
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: sumzle-solver
            asset_name: sumzle-solver-linux-aarch64
            archive_ext: tar.gz
            archive_cmd: tar -czf
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sumzle-solver.exe
            asset_name: sumzle-solver-windows-x86_64
            archive_ext: zip
            archive_cmd: 7z a -tzip
          - os: macOS-latest
            target: x86_64-apple-darwin
            artifact_name: sumzle-solver
            asset_name: sumzle-solver-macos-x86_64
            archive_ext: tar.gz
            archive_cmd: tar -czf
          - os: macOS-latest
            target: aarch64-apple-darwin
            artifact_name: sumzle-solver
            asset_name: sumzle-solver-macos-aarch64
            archive_ext: tar.gz
            archive_cmd: tar -czf

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ---------------------------------------------------------------------
      #  Build the frontend. The output (frontend/dist) is platform-
      #  independent static HTML/JS/CSS, so we build it once per target
      #  inside the matrix (parallelized by GitHub) and bundle it next to
      #  the binary. The Rust server auto-discovers <exe_dir>/frontend/dist.
      # ---------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---------------------------------------------------------------------
      #  Stage the combined package: binary + frontend/dist + README +
      #  launcher. Layout matches what get_frontend_dir() expects so the
      #  server serves the UI out of the box.
      # ---------------------------------------------------------------------
      - name: Stage combined package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          set -euo pipefail
          STAGE="staging/${{ matrix.asset_name }}"
          mkdir -p "$STAGE/frontend"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$STAGE/"
          cp -r frontend/dist "$STAGE/frontend/"
          # Per-platform launcher + README
          cat > "$STAGE/run.sh" << 'LAUNCHER'
          #!/usr/bin/env bash
          # Launch the Sumzle HPC Solver backend, which also serves the
          # bundled frontend at http://localhost:3000
          set -euo pipefail
          cd "$(dirname "$0")"
          PORT="${PORT:-3000}"
          HOST="${HOST:-0.0.0.0}"
          exec ./sumzle-solver serve --host "$HOST" --port "$PORT"
          LAUNCHER
          chmod +x "$STAGE/run.sh"
          cat > "$STAGE/README.md" << 'README'
          # Sumzle HPC Solver

          A high-performance solver for the Sumzle equation puzzle, with a
          built-in web frontend. This archive contains everything you need —
          no build step required.

          ## Quick start (Unix)

          ```bash
          ./run.sh
          # or directly:
          ./sumzle-solver serve --host 0.0.0.0 --port 3000
          ```

          Then open http://localhost:3000 in your browser. The backend
          automatically serves the bundled frontend from `frontend/dist`.

          ## Contents

          | File | Purpose |
          |------|---------|
          | `sumzle-solver` | The backend binary (Rust release build) |
          | `frontend/dist/` | Pre-built web frontend (static HTML/JS/CSS) |
          | `run.sh` / `run.bat` | Launcher script |
          | `README.md` | This file |

          ## CLI usage

          ```bash
          ./sumzle-solver solve -i puzzle.json -t 0 -f json
          ./sumzle-solver validate "1+2=3"
          ./sumzle-solver eval "5!"
          ./sumzle-solver bench -l 5 6 7
          ```

          ## Custom frontend location

          Set the `STATIC_DIR` environment variable to serve the frontend
          from a custom directory:

          ```bash
          STATIC_DIR=/path/to/dist ./sumzle-solver serve
          ```

          ## License

          MIT
          README

      - name: Stage combined package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="staging/${{ matrix.asset_name }}"
          mkdir -p "$STAGE/frontend"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$STAGE/"
          cp -r frontend/dist "$STAGE/frontend/"
          cat > "$STAGE/run.bat" << 'LAUNCHER'
          @echo off
          REM Launch the Sumzle HPC Solver backend, which also serves the
          REM bundled frontend at http://localhost:3000
          cd /d "%~dp0"
          if "%PORT%"=="" set PORT=3000
          if "%HOST%"=="" set HOST=0.0.0.0
          sumzle-solver.exe serve --host %HOST% --port %PORT%
          LAUNCHER
          cat > "$STAGE/README.md" << 'README'
          # Sumzle HPC Solver

          A high-performance solver for the Sumzle equation puzzle, with a
          built-in web frontend. This archive contains everything you need —
          no build step required.

          ## Quick start (Windows)

          ```cmd
          run.bat
          :: or directly:
          sumzle-solver.exe serve --host 0.0.0.0 --port 3000
          ```

          Then open http://localhost:3000 in your browser. The backend
          automatically serves the bundled frontend from `frontend\dist`.

          ## Contents

          | File | Purpose |
          |------|---------|
          | `sumzle-solver.exe` | The backend binary (Rust release build) |
          | `frontend\dist\` | Pre-built web frontend (static HTML/JS/CSS) |
          | `run.bat` | Launcher script |
          | `README.md` | This file |

          ## CLI usage

          ```cmd
          sumzle-solver.exe solve -i puzzle.json -t 0 -f json
          sumzle-solver.exe validate "1+2=3"
          sumzle-solver.exe eval "5!"
          sumzle-solver.exe bench -l 5 6 7
          ```

          ## Custom frontend location

          Set the `STATIC_DIR` environment variable to serve the frontend
          from a custom directory:

          ```cmd
          set STATIC_DIR=C:\path\to\dist
          sumzle-solver.exe serve
          ```

          ## License

          MIT
          README

      - name: Create combined archive
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          ARCHIVE="${{ matrix.asset_name }}.${{ matrix.archive_ext }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a -tzip "$ARCHIVE" "${{ matrix.asset_name }}"
          else
            tar -czf "$ARCHIVE" "${{ matrix.asset_name }}"
          fi
          echo "Created $ARCHIVE"
          ls -la "$ARCHIVE"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: staging/${{ matrix.asset_name }}.${{ matrix.archive_ext }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-release, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    # softprops/action-gh-release needs contents:write to create the
    # release and upload assets. Without this, the default GITHUB_TOKEN
    # is read-only on repos whose default token permissions are read-only,
    # and the release step fails with 403 "Resource not accessible by
    # integration".
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List release assets
        run: |
          echo "## 📦 Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each archive bundles the backend binary AND the pre-built frontend (frontend/dist). Unpack and run — no build step required." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Platform |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|" >> $GITHUB_STEP_SUMMARY
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *linux-x86_64*)   platform="Linux x86_64" ;;
              *linux-aarch64*)  platform="Linux ARM64" ;;
              *windows-x86_64*) platform="Windows x86_64" ;;
              *macos-x86_64*)   platform="macOS x86_64" ;;
              *macos-aarch64*)  platform="macOS ARM64" ;;
              *)                platform="Other" ;;
            esac
            size=$(stat -c %s "$f" 2>/dev/null || stat -f %z "$f" 2>/dev/null || echo 0)
            if [ "$size" -ge 1048576 ]; then
              size_hr="$(awk "BEGIN {printf \"%.1f MB\", $size/1048576}")"
            elif [ "$size" -ge 1024 ]; then
              size_hr="$(awk "BEGIN {printf \"%.1f KB\", $size/1024}")"
            else
              size_hr="$size B"
            fi
            echo "| \`$base\` ($size_hr) | $platform |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          find artifacts -type f | sort >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body: |
            ## Combined release archives

            Each archive bundles the backend binary AND the pre-built web
            frontend — **unpack and run, no build step required**.

            | Platform | Archive |
            |----------|---------|
            | Linux x86_64 | `sumzle-solver-linux-x86_64.tar.gz` |
            | Linux ARM64 | `sumzle-solver-linux-aarch64.tar.gz` |
            | Windows x86_64 | `sumzle-solver-windows-x86_64.zip` |
            | macOS x86_64 | `sumzle-solver-macos-x86_64.tar.gz` |
            | macOS ARM64 | `sumzle-solver-macos-aarch64.tar.gz` |

            ## Quick start

            **Unix** (Linux / macOS):
            ```bash
            tar -xzf sumzle-solver-<platform>.tar.gz
            cd sumzle-solver-<platform>
            ./run.sh
            ```

            **Windows**:
            ```cmd
            Expand-Archive sumzle-solver-windows-x86_64.zip
            cd sumzle-solver-windows-x86_64
            run.bat
            ```

            Then open http://localhost:3000 in your browser. The backend
            automatically serves the bundled frontend from `frontend/dist`.

            See the in-archive `README.md` for CLI usage and advanced options.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
