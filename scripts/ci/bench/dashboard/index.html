<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sumzle Benchmark History</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Sumzle Benchmark History</h1>
        <p id="summary">Loading benchmark history...</p>
      </div>
      <a id="repo-link" href="https://github.com/SUSTechHSAS/sumzle-hpc-solver">Repository</a>
    </header>

    <main>
      <section class="controls" aria-label="Benchmark filters">
        <label>
          Series
          <select id="series-filter"></select>
        </label>
        <label>
          Suite
          <select id="suite-filter"></select>
        </label>
        <label>
          Metric
          <select id="metric-filter"></select>
        </label>
        <label>
          Case
          <select id="case-filter"></select>
        </label>
        <label>
          Recent runs
          <input id="range-filter" type="range" min="2" max="100" value="40" />
          <output id="range-output">40</output>
        </label>
      </section>

      <section class="chart-panel">
        <svg id="chart" role="img" aria-label="Benchmark chart"></svg>
        <div id="tooltip" hidden></div>
      </section>

      <section class="table-panel">
        <h2>Visible Runs</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Series</th>
                <th>Commit</th>
                <th>Value</th>
                <th>Run</th>
              </tr>
            </thead>
            <tbody id="run-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
